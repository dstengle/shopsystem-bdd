[pytest]
testpaths = tests
bdd_features_base_dir = features/
addopts = -n auto --dist loadgroup -m "not fixture and not timing"
markers =
    live_logic: solves the live spec's model logic (the session fixture live_logic of tests/scripts/conftest.py)
    timing: holds a time ceiling, so it runs alone and not in the parallel run: `python3 -m pytest -m timing -n 0`
    requirement(id): a test of the requirement `<capability>#r<n>`, read by a capability's trace test (test_pr_review_trace.py)

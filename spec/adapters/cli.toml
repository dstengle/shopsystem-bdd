# The CLI adapter's contract of this bounded context (the domain contract design, §6.1): each operation of the
# domain model (spec/model/) with the command that requests it and its parameters' options, checked both ways
# against the programs' argparse by `model check` (v_a1-v_a4).
adapter = "cli"
json = "--json"

[programs]
work = "scripts/work"
spec = "scripts/spec"
features = "scripts/features"
tools = "scripts/tools"
measure = "scripts/measure"
migrate = "scripts/migrate"

[outcomes]
done = { exit = 0 }
returned = { exit = 0, content = "stdout" }
passed = { exit = 0, content = "stdout" }
refused = { exit = 1, errors = "stderr" }
failed = { exit = 1, content = "stdout", errors = "stderr" }
broken = { exit = 1, errors = "stderr" }

[cli-only]
options = ["--json", "--root", "--hook", "--python"]
# commands no operation of the model names: the adapter's own (hooks' output, catalogues, reports)
commands = ["work batch brief", "work directives", "work names", "spec constructs", "spec restates"]

[unexposed]
# operations an agent performs when dispatched, which no command requests
operations = ["reviews.review", "measurement.conduct", "measurement.hand"]

[environment]
VIRTUAL_ENV = "toolchain.probe: the Python interpreter, when none is given"
SHOPSYSTEM_WORK_GH = "the issue host port: the gh program context requests and batches call"
SHOPSYSTEM_PUSH_TIMEOUT = "the shared store port: how long a push may take"

[operations."language.parse"]
command = "spec parse"
cli-only = { options = ["--file"] }
requirements = [
  "parsing#r1: When the person parses a requirement that conforms to the language reference, the language service shall complete the request.",
  "parsing#r2: When the person parses a requirement that conforms to the language reference with the logical form, the language service shall return one logical form of the requirement and complete the request.",
  "parsing#r3: If the person parses a requirement that does not conform to the language reference, then the language service shall refuse the request and name the requirement.",
  "parsing#r4: If the person parses a requirement that has more than one logical form, then the language service shall refuse the request and name the requirement.",
  "parsing#r5: If the person parses a requirement that violates a reading rule, then the language service shall refuse the request and name the reading rule.",
  "parsing#r6: If the person parses a requirement that uses a construct that has no catalogue entry, then the language service shall refuse the request and name the construct.",
  "parsing#r7: If the person parses a fragment, then the language service shall refuse the request, name the fragment and return a term.",
  "parsing#r8: While the corpus holds a logical form of a requirement, when the person parses the requirement with the logical form, the language service shall return the logical form.",
  "parsing#r9: While a parse cache holds the parse of a requirement, when the person parses the requirement, the language service shall return the parse of the requirement, keep no compiled grammar and complete the request.",
  "parsing#r10: While a requirement has a parse that no parse cache holds, when the person parses the requirement, the language service shall keep a parse cache and complete the request.",
  "parsing#r11: While a requirement has a parse that no parse cache holds and the compiled grammar of the requirement exists, when the person parses the requirement, the language service shall keep no compiled grammar and complete the request.",
  "parsing#r12: When the person parses a requirement that uses `order-by` with the logical form, the language service shall return a logical form that uses an order of a member of a collection.",
]
[operations."language.parse".parameters]
text = { positional = 1 }
"logical form" = { option = "--form", flag = true }

[operations."language.explain"]
command = "spec explain"
requirements = [
  "consistency#r1: When the person explains a requirement, the language service shall return the requirement and complete the request.",
  "consistency#r11: When the person explains a requirement that uses a refusal, the language service shall return a universal condition and a term.",
  "consistency#r12: When the person explains a requirement that a requirement overrides, the language service shall return a requirement that uses a refusal.",
  "consistency#r13: If the person explains a requirement id that no capability holds, then the language service shall refuse the request and name the requirement id.",
]
[operations."language.explain".parameters]
text = { positional = 1 }

[operations."language.look up"]
command = "spec lexicon"
cli-only = { options = ["--check"] }
requirements = [
  "checking#r41: While this bounded context imports a pack, when the person looks up the pack, the language service shall return every term of the pack and complete the request.",
]

[operations."specification.check"]
command = "spec check"
cli-only = { options = ["--limit"] }
requirements = [
  "checking#r3: While nothing violates a rule, when the person validates this specification, the specification service shall return `0 violations` and complete the request.",
  "checking#r18: While a request does not conform to the request form, if the person validates this specification, then the specification service shall fail the check and name the request.",
  "checking#r19: While a scenario refers to a requirement id that the capability of the scenario does not hold, if the person validates this specification, then the specification service shall fail the check and name the scenario.",
  "checking#r20: While a capability does not conform to the capability id form, if the person validates this specification, then the specification service shall fail the check and name the capability.",
  "checking#r21: While a capability has no section whose heading is `Behaviour`, if the person validates this specification, then the specification service shall fail the check and name the capability.",
  "checking#r22: While a feature does not conform to the feature form, if the person validates this specification, then the specification service shall fail the check and name the feature.",
  "checking#r23: While a term does not conform to the entry form, if the person validates this specification, then the specification service shall fail the check and name the term.",
  "checking#r24: While this bounded context does not conform to the final layout, if the person validates this specification, then the specification service shall fail the check and name `scripts/migrate`.",
  "checking#r26: While this bounded context has no job, when the person validates this specification, the specification service shall return no capability that violates `w_unserved_cap`.",
  "checking#r27: While this interpreter does not import `clingo` and another interpreter imports `clingo`, when the person validates this specification, the specification service shall return `0 violations`.",
  "checking#r28: While no interpreter imports `clingo`, if the person validates this specification, then the specification service shall fail the check and name this interpreter.",
  "checking#r30: While a verb has no frame, if the person validates this specification, then the specification service shall fail the check and name the verb.",
  "checking#r32: While a term has no part of speech, if the person validates this specification, then the specification service shall fail the check and name the term.",
  "checking#r33: While a frame of a term has a preposition, when the person validates this specification, the specification service shall complete the request.",
  "checking#r38: While a term has more than one frame, when the person validates this specification, the specification service shall complete the request.",
  "checking#r39: While a term has more than one sense, when the person validates this specification, the specification service shall complete the request.",
  "checking#r44: While a term redefines a pack, when the person validates this specification, the specification service shall complete the request.",
  "checking#r46: If the person validates this specification with a capability whose language is `codified-1`, then the specification service shall refuse the request and name the capability.",
  "checking#r49: While a requirement governs an operation that an adapter contract holds and the operation does not hold the requirement, if the person validates this specification, then the specification service shall fail the check and name the operation and the requirement.",
  "checking#r50: While an adapter contract holds an operation and the operation holds a requirement and the requirement does not govern the operation, if the person validates this specification, then the specification service shall fail the check and name the operation and the requirement.",
  "checking#r52: While a capability violates a rule whose severity is `error`, if the person validates this specification, then the specification service shall fail the check and name the rule.",
  "checking#r53: While a capability violates a rule whose severity is `warning` and nothing violates a rule whose severity is `error`, when the person validates this specification, the specification service shall name the rule and complete the request.",
  "checking#r54: While a requirement uses a rule that has no catalogue entry, if the person validates this specification, then the specification service shall fail the check and name the rule.",
  "checking#r55: While a catalogue entry has no purpose, if the person validates this specification, then the specification service shall fail the check and name the catalogue entry.",
  "checking#r57: While a catalogue entry mentions an item whose status is not `delivered`, if the person validates this specification, then the specification service shall fail the check and name the catalogue entry and the item.",
  "checking#r58: While a catalogue entry mentions no item and the catalogue entry mentions no release, if the person validates this specification, then the specification service shall fail the check and name the catalogue entry.",
  "decisions#r1: While a design-decision is not `superseded` or `rejected` and the design-decision has no tier, when the person validates this specification, the specification service shall return `w_untiered`.",
  "decisions#r2: While the tier of a design-decision is `check` and no test enforces the design-decision, if the person validates this specification, then the specification service shall fail the check and name `v_d6`.",
  "decisions#r3: While the tier of a design-decision is `requirement` and no requirement enforces the design-decision, if the person validates this specification, then the specification service shall fail the check and name `v_d7`.",
  "decisions#r6: While a design-decision whose status is `accepted` supersedes a design-decision whose status is `accepted`, if the person validates this specification, then the specification service shall fail the check and name `v_d8`.",
  "decisions#r12: When the person validates this specification, the specification service shall return every universal condition that no design-decision verifies.",
  "decisions#r13: While the kind of a route of a design-decision is not `scenario`, `check`, `judgement` or `monitor`, if the person validates this specification, then the specification service shall fail the check and name the design-decision.",
  "decisions#r17: While a design-decision has no id, if the person validates this specification, then the specification service shall fail the check and name the design-decision.",
  "decisions#r20: While a design-decision has no section whose heading is `Decision`, if the person validates this specification, then the specification service shall fail the check and name the design-decision.",
]

[operations."specification.examine"]
command = "spec logic"
requirements = [
  "consistency#r2: While two requirements of a capability use a code that the specification service does not unify and a requirement of the capability obliges an act that another requirement of the capability forbids, when the person examines this specification, the specification service shall return a requirement and return `L1`.",
  "consistency#r3: While a requirement of a capability uses `only` and the requirement allows an act that another requirement of the capability obliges, when the person examines this specification, the specification service shall complete the request.",
  "consistency#r4: While a requirement of a capability uses `every` and the requirement obliges an act and another requirement of the capability that has the trigger of the requirement forbids the act, when the person examines this specification, the specification service shall return `L1`.",
  "consistency#r5: While a requirement of a capability overrides another requirement of the capability, when the person examines this specification, the specification service shall complete the request.",
  "consistency#r6: While a universal condition forbids an act that a requirement of a capability obliges, when the person examines this specification, the specification service shall return the universal condition.",
  "consistency#r7: While a requirement has a consequence and the requirement adds no consequence, when the person examines this specification, the specification service shall return `L8`.",
  "consistency#r8: While a capability holds a count that contradicts a count, when the person examines this specification, the specification service shall return `L1`.",
  "consistency#r9: While a requirement of a capability forbids an act that another requirement of the capability permits, when the person examines this specification, the specification service shall return `L7`.",
  "consistency#r10: While the language of a capability is `codified-2`, when the person examines this specification, the specification service shall complete the request.",
  "consistency#r14: While a requirement of a capability conforms to the language reference, when the person examines this specification with the capability, the specification service shall return a translation of the requirement.",
  "consistency#r15: While a requirement of a capability uses `only` and the requirement uses `holds-relation`, when the person examines this specification with the capability, the specification service shall return a translation of the requirement.",
  "consistency#r16: While a requirement of a capability uses `count` and the requirement uses `holds-relation`, when the person examines this specification with the capability, the specification service shall return a translation of the requirement.",
  "consistency#r17: While a requirement of a capability has no translation, when the person examines this specification with the capability, the specification service shall return the requirement and not return `no findings`.",
  "consistency#r18: While a requirement of a capability uses `holds-exactly` and the requirement obliges an act and another requirement of the capability that has the trigger of the requirement forbids the act, when the person examines this specification, the specification service shall return `L1`.",
  "consistency#r19: While a requirement uses `is-in` and the requirement obliges an act and another requirement that forbids the act uses `holds-relation`, when the person examines this specification, the specification service shall return `L1`.",
  "consistency#r20: While a requirement of a capability uses `value-compare` and the requirement obliges an act and another requirement of the capability that has the trigger of the requirement forbids the act, when the person examines this specification, the specification service shall return `L1`.",
  "consistency#r21: While a requirement of a capability obliges an act that another requirement of the capability forbids and a comparison of the precondition of the requirement contradicts a comparison, when the person examines this specification, the specification service shall complete the request.",
  "consistency#r22: While a capability holds an order that contradicts an order, when the person examines this specification, the specification service shall return `L1`.",
  "consistency#r23: While a sense of a term has a value order and another sense of the term has the value order and a requirement of a capability uses the term and `value-compare` and the requirement obliges an act and another requirement of the capability that has the trigger of the requirement forbids the act, when the person examines this specification, the specification service shall return `L1`.",
  "consistency#r24: While a requirement of a capability uses `holds-exactly` and `rc-object` and the requirement obliges an act and another requirement of the capability that has the trigger of the requirement forbids the act, when the person examines this specification, the specification service shall return `L1`.",
  "consistency#r25: While a requirement of a capability uses `nothing` and `rc-subject` and the requirement obliges an act and another requirement of the capability that has the trigger of the requirement forbids the act, when the person examines this specification, the specification service shall return `L1`.",
  "consistency#r26: While the precondition of a requirement of a capability uses `every` and `not-condition`, when the person examines this specification with the capability, the specification service shall return a translation of the requirement.",
  "consistency#r27: While a requirement uses `nothing` and `rc-subject` and the requirement obliges an act and another requirement that forbids the act uses `holds-relation`, when the person examines this specification, the specification service shall complete the request.",
  "consistency#r28: While a requirement uses `no-noun` and `holds-relation` and the requirement obliges an act and another requirement that forbids the act uses `holds-relation`, when the person examines this specification, the specification service shall complete the request.",
  "consistency#r29: While a requirement uses `holds-relation` and `rc-subject` and the requirement obliges an act and another requirement that forbids the act uses `holds-relation`, when the person examines this specification, the specification service shall return `L1`.",
  "consistency#r30: While a requirement of a capability uses `holds-exactly` and `of-relation` and the requirement obliges an act and another requirement of the capability that has the trigger of the requirement forbids the act, when the person examines this specification, the specification service shall return `L1`.",
  "consistency#r31: While a requirement uses `not-relative` and a code and the requirement forbids an act and another requirement obliges the act and the requirement uses `rc-whose` and the requirement does not use the code, when the person examines this specification, the specification service shall return `L1`.",
  "consistency#r32: While a requirement uses `not-relative` and a code and the requirement forbids an act and another requirement obliges the act and the requirement uses `rc-whose` and the code, when the person examines this specification, the specification service shall complete the request.",
  "consistency#r33: While the precondition of a requirement of a capability uses `holds-exactly` and `rc-subject`, when the person examines this specification with the capability, the specification service shall return a translation of the requirement.",
]
[operations."specification.examine".parameters]
capability = { positional = 1 }

[operations."specification.consult"]
command = "spec rules"
requirements = [
  "checking#r1: When the person consults the rule catalogue, the specification service shall return every rule and complete the request.",
]

[operations."specification.renew"]
command = "spec rules"
cli-only = { options = ["--write"] }
requirements = [
  "checking#r35: When the person renews the rule catalogue, the specification service shall keep a rule catalogue and complete the request.",
  "checking#r36: While a rule has a catalogue entry that a rule catalogue does not hold, if the person renews the rule catalogue with the audit, then the specification service shall fail the check, name the rule catalogue and change no file.",
]
[operations."specification.renew".parameters]
audit = { option = "--check", flag = true }

[operations."specification.inventory"]
command = "spec forms"
requirements = [
  "checking#r2: When the person inventories this specification, the specification service shall return every file form and complete the request.",
  "checking#r47: While the writer of a file form is `hand`, when the person inventories this specification with the audit, the specification service shall fail the check and name the file form.",
]
[operations."specification.inventory".parameters]
audit = { option = "--check", flag = true }

[operations."specification.translate"]
command = "spec facts"
requirements = [
  "checking#r29: When the person translates this specification, the specification service shall return every fact of this bounded context.",
]

[operations."specification.annotate"]
command = "spec annotate"
requirements = [
  "checking#r48: While a requirement governs an operation that an adapter contract holds, when the person annotates the adapter contract, the specification service shall keep an adapter contract that holds an operation that holds the requirement and complete the request.",
  "checking#r51: While a requirement governs an operation that an adapter contract holds and the operation does not hold the requirement, if the person annotates the adapter contract with the audit, then the specification service shall fail the check, name the adapter contract and change no file.",
]
[operations."specification.annotate".parameters]
"adapter contract" = { positional = 1 }
audit = { option = "--check", flag = true }

[operations."decisions.enter"]
command = "work decision"
cli-only = { options = ["--alternatives", "--by", "--context", "--date", "--enforced-by", "--rests-on", "--slug", "--source"] }
requirements = [
  "decisions#r7: When the person enters a design-decision, the decisions service shall keep the design-decision and the decisions index.",
  "decisions#r8: If the person enters a design-decision without a tier, then the decisions service shall refuse the request and name the tier.",
  "decisions#r9: If the person enters a design-decision without a summary, then the decisions service shall refuse the request and name the summary.",
  "decisions#r10: If the person enters a design-decision without a wording, then the decisions service shall refuse the request and name the wording.",
  "decisions#r11: When the person enters a design-decision with a route, the decisions service shall keep a design-decision that has a route.",
  "decisions#r14: When the person enters a design-decision over a design-decision whose status is `accepted`, the decisions service shall set the status of the design-decision to `superseded` and keep the design-decision.",
  "decisions#r15: If the person enters a design-decision over a design-decision whose status is not `accepted`, then the decisions service shall refuse the request and name the design-decision.",
]
[operations."decisions.enter".parameters]
title = { positional = 1 }
summary = { option = "--summary" }
tier = { option = "--tier" }
wording = { option = "--decision" }
route = { option = "--verified-by", repeat = true }
supersedes = { option = "--supersedes", repeat = true }

[operations."decisions.rebuild"]
command = "spec decisions"
requirements = [
  "decisions#r4: While the tier of a design-decision is `check` and a test enforces the design-decision, when the person rebuilds the decisions index with the audit, the decisions service shall return the verdict of the test.",
  "decisions#r5: While the tier of a design-decision is `check` and a test whose verdict is `failed` enforces the design-decision, if the person rebuilds the decisions index with the audit, then the decisions service shall fail the check and name the design-decision.",
  "decisions#r16: When the person rebuilds the decisions index, the decisions service shall keep the decisions index.",
  "decisions#r18: While a design-decision has an index entry that a decisions index does not hold, if the person rebuilds the decisions index with the audit, then the decisions service shall fail the check, name the decisions index and change no file.",
  "decisions#r19: While no decisions index lacks an index entry, when the person rebuilds the decisions index with the audit, the decisions service shall complete the request.",
]
[operations."decisions.rebuild".parameters]
audit = { option = "--check", flag = true }

[operations."records.file"]
command = "work record"
cli-only = { options = ["--body", "--date", "--kind", "--slug"] }
requirements = [
  "records#r1: When the person files a record, the records service shall keep the record.",
  "records#r2: If the person files a record with a text that does not conform to the node id form, then the records service shall refuse the request and name the text.",
]
[operations."records.file".parameters]
title = { positional = 1 }
summary = { option = "--summary" }
text = { option = "--about" }

[operations."scenarios.generate"]
command = "features generate"
cli-only = { options = ["--preview", "--root"] }
requirements = [
  "scenarios#r1: While the feature of a capability has a scenario that no requirement group has, if the person generates the feature of the capability with the audit, then the scenarios service shall fail the check, name the feature and change no file.",
  "scenarios#r3: While the language of a capability is `codified-2` and every requirement of the capability conforms to the language reference and every requirement of the capability uses the `shall` construct, when the person generates the feature of the capability, the scenarios service shall keep the scenario of every requirement group of the capability.",
  "scenarios#r4: While the language of a capability is `codified-2`, when the person generates the feature of the capability, the scenarios service shall not keep a step that a universal condition entails.",
  "scenarios#r5: While the group of a capability is `service` and the language of the capability is `codified-2`, when the person generates the feature of the capability, the scenarios service shall keep the feature of the capability and return the feature.",
  "scenarios#r6: While an act of a requirement of a capability brings in a referent, when the person generates the feature of the capability, the scenarios service shall keep a description of the referent that follows the act and not keep a description of the referent that precedes the act.",
  "scenarios#r7: While a requirement of a capability uses `only` and the requirement uses `holds-relation`, when the person generates the feature of the capability, the scenarios service shall keep a scenario that uses `only`.",
  "scenarios#r8: While a requirement of a capability uses `count` and the requirement uses `holds-relation`, when the person generates the feature of the capability, the scenarios service shall keep a scenario that uses `count`.",
  "scenarios#r9: While a requirement of a requirement group of a capability uses `every` and the requirement has a restriction, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that has a counter-example.",
  "scenarios#r10: While a requirement of a requirement group of a capability uses `only` and the requirement has a restriction, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that has a counter-example and not keep a step that asserts an act that the requirement allows.",
  "scenarios#r11: While a requirement of a requirement group of a capability has an upper bound, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that has a counter-example.",
  "scenarios#r12: While the precondition of a requirement of a requirement group of a capability uses `every`, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that satisfies the precondition.",
  "scenarios#r13: While the precondition of a requirement of a requirement group of a capability holds a count, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that has the boundary of the count.",
  "scenarios#r14: While a requirement of a requirement group of a capability uses `two`, when the person generates the feature of the capability, the scenarios service shall not keep a step that mentions an instance that no given step introduces.",
  "scenarios#r15: While a requirement of a capability uses `holds-exactly`, when the person generates the feature of the capability, the scenarios service shall keep a scenario whose step uses `not-condition`.",
  "scenarios#r16: While the precondition of a requirement of a capability uses `nothing`, when the person generates the feature of the capability, the scenarios service shall keep a scenario whose step uses `nothing`.",
  "scenarios#r17: While a requirement of a requirement group of a capability uses an order, when the person generates the feature of the capability, the scenarios service shall keep a scenario that has an order counter-example.",
  "scenarios#r18: While a term has two senses and a requirement of a requirement group of a capability uses the term and `order-by`, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that has an order counter-example.",
  "scenarios#r19: While a term has two senses and a requirement of a requirement group of a capability uses the term and `order-by-every`, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that has an order counter-example.",
  "scenarios#r20: While a requirement of a capability uses `holds-exactly` and `rc-object`, when the person generates the feature of the capability, the scenarios service shall keep a scenario whose step uses `not-condition`.",
  "scenarios#r21: While a requirement of a capability uses `nothing` and `rc-subject`, when the person generates the feature of the capability, the scenarios service shall keep a scenario whose step uses `nothing`.",
  "scenarios#r22: While a requirement of a requirement group of a capability uses `order-by` and the requirement uses a verb that has no frame that takes `thing`, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that has an order counter-example.",
  "scenarios#r23: While a requirement of a requirement group of a capability uses `no-noun` and `holds-relation` and the precondition of the requirement does not use `no-noun`, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that has a counter-example.",
  "scenarios#r24: While the precondition of a requirement of a requirement group of a capability uses `every` and `not-condition`, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that satisfies the precondition.",
  "scenarios#r25: While a requirement of a requirement group of a capability uses `order-by-every` and the requirement uses a verb that has no frame that takes `thing`, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that has an order counter-example.",
  "scenarios#r26: While a requirement of a requirement group of a capability uses `holds-relation` and `rc-subject`, when the person generates the feature of the capability, the scenarios service shall not keep a step that mentions an instance that no given step introduces.",
  "scenarios#r27: While a requirement of a requirement group of a capability uses `order-by`, when the person generates the feature of the capability, the scenarios service shall not keep a step that mentions an instance that no given step introduces.",
  "scenarios#r28: While a requirement of a requirement group of a capability uses `order-by-every` and `of-relation`, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that has an order counter-example.",
  "scenarios#r29: While a requirement of a requirement group of a capability uses `count` and `holds-relation` and the requirement has an upper bound, when the person generates the feature of the capability, the scenarios service shall keep a scenario of the requirement group that has a counter-example.",
  "scenarios#r30: While a requirement of a capability uses `holds-exactly` and `of-relation`, when the person generates the feature of the capability, the scenarios service shall keep a scenario whose step uses `not-condition`.",
  "scenarios#r31: While the precondition of a requirement of a capability uses `holds-exactly`, when the person generates the feature of the capability, the scenarios service shall keep a scenario whose step uses `not-condition`.",
  "scenarios#r32: While the precondition of a requirement of a capability uses `holds-exactly` and `rc-subject`, when the person generates the feature of the capability, the scenarios service shall keep a scenario whose step uses `not-condition`.",
]
[operations."scenarios.generate".parameters]
capability = { positional = 1 }
audit = { option = "--check", flag = true }

[operations."scenarios.audit"]
command = "features vocab"
cli-only = { options = ["--check", "--root", "--tests"] }
requirements = [
  "scenarios#r2: While a step of a feature has no handler, if the person audits the feature, then the scenarios service shall fail the check, name the step, name the feature and change no file.",
]
[operations."scenarios.audit".parameters]
feature = { positional = 1 }

[operations."feature reading.search"]
command = "features list"
requirements = [

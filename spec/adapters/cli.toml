# The CLI adapter's contract of this bounded context (the domain contract design, §6.1): each operation of the
# domain model (spec/model/) with the command that requests it and its parameters' options, checked both ways
# against the programs' argparse by `model check` (v_a1-v_a4).
adapter = "cli"
json = "--json"

[programs]
work = "scripts/work"
spec = "scripts/spec"
features = "scripts/features"
tools = "scripts/tools"
measure = "scripts/measure"
migrate = "scripts/migrate"

[outcomes]
done = { exit = 0 }
returned = { exit = 0, content = "stdout" }
passed = { exit = 0, content = "stdout" }
refused = { exit = 1, errors = "stderr" }
failed = { exit = 1, content = "stdout", errors = "stderr" }
broken = { exit = 1, errors = "stderr" }

[cli-only]
options = ["--json", "--root", "--hook", "--python"]
# commands no operation of the model names: the adapter's own (hooks' output, catalogues, reports)
commands = ["work batch brief", "work directives", "work names", "spec constructs", "spec restates"]

[unexposed]
# operations an agent performs when dispatched, which no command requests
operations = ["reviews.review", "measurement.conduct", "measurement.hand"]

[environment]
VIRTUAL_ENV = "toolchain.probe: the Python interpreter, when none is given"
SHOPSYSTEM_WORK_GH = "the issue host port: the gh program context requests and batches call"
SHOPSYSTEM_PUSH_TIMEOUT = "the shared store port: how long a push may take"


[constructs.number-of]
purpose = "Treats how many things there are as a value a line can print or compare with a bound."
since = "b240"
changed = []

[constructs.exists]
purpose = "States that a thing exists or that none does, for things whose presence alone matters."
since = "b240"
changed = []

[constructs.moment-compare]
purpose = "Lets a condition depend on one moment falling before or after another, such as a deadline."
since = "b240"
changed = []

[constructs.within]
purpose = "Lets a condition depend on a moment falling within a recent span of time before the trigger."
since = "b240"
changed = []

[constructs.response-request]
purpose = "Lets a response make a request of an operation with its parameters, so a line can say what the core asks of a port."
since = "b543"
changed = []

[rules.v_pb1]
purpose = "A driven port holds only what the core uses: an operation no core line requests has no place in it (decision 0116)."
since = "b549"
changed = []

[rules.v_pb2]
purpose = "Every outcome the upstream may give reaches a core line or is excluded by a port line, so none goes unhandled (decisions 0116, 0127)."
since = "b549"
changed = []

[rules.v_pb3]
purpose = "A port line's Relied on by names only core lines that request its operation, so the citation stays true (decision 0126)."
since = "b549"
changed = []

[rules.v_pb4]
purpose = "Every port line stands on a core line, cited or computed, so the port holds nothing the core does not rely on (decisions 0116, 0126)."
since = "b549"
changed = []

[rules.v_m9]
purpose = "A lifecycle's transitions are performed only by operations of the area that declares its object, so one area owns each object's lifecycle."
since = "b610"
changed = []

[rules.v_job_elsewhere]
purpose = "A job is served only in the bounded context the product assigns it to, so two contexts never both answer for it."
since = "b643"
changed = []

[rules.v_need_cycle]
purpose = "A job's needs never close a cycle, so its trace joins the traces of the jobs it needs once."
since = "b643"
changed = []

[rules.w_unheld_job]
purpose = "Every job of the product is assigned to a bounded context, so none is left with no one to serve it."
since = "b643"
changed = []

[rules.w_untriggered_actor]
purpose = "Each actor of a job starts a line of the job's trace in the bounded context that holds it, so no actor of the job is left out."
since = "b643"
changed = []

[rules.w_unaddressed_sub]
purpose = "Every subdomain of the product is given its solution by a bounded context of the domain map."
since = "b643"
changed = []

[rules.w_unreached_sub]
purpose = "A job's trace reaches a bounded context that addresses each subdomain serving the job."
since = "b643"
changed = []

[rules.w_unformed_product]
purpose = "A product file that does not read as the product form is named among the findings, so it stops no check of the context."
since = "b695"
changed = []

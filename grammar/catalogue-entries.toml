# What each entry of the rule catalogue (grammar/rules.md) and the construct catalogue (grammar/constructs.md)
# says beside what model.lp and the grammar give it (b370): its purpose, the item it came by (since) and the items
# that changed it (changed). `spec rules --write` and `spec constructs --write` write them into the catalogues;
# `spec check` fails an entry with no purpose or no item, or one naming an item that is not delivered. A batch that
# adds or changes a rule or a construct adds its item here. The first filling (b370) read each entry's history off
# git: the commits that added or changed its label, examples or rule (scripts/model.lp, scripts/model_rules.py) or
# its table entry (scripts/model_constructs_table.py), and the items they cite; an entry whose commits cite no item
# (work from before items were tracked) names the release whose tag first contains the commit that added it, a
# section of CHANGELOG.md. A new or changed entry names an item.


 today is changed or removed, `formulating-features` shall replace or remove the old scenario.", "prev": "[r5] **When** a line is changed or removed and its old scenario does not pass today, the old scenario is replaced or removed.", "kind": "reworded", "answer": "r5: r5 \u2014 unchanged meaning"}, {"n": 6, "text": "**When** `formulating-features` commits feature files, `formulating-features` shall commit only the feature files and the test files `features rebind` changed, with `features bindings` reporting that every binding names a scenario.", "prev": "[r6] **When** feature files are committed, `features bindings` reports that every binding names a scenario, and the commit contains only the feature files and the test files `features rebind` changed.", "kind": "reworded", "answer": "r6: r6 \u2014 one response, the commit, with what `features bindings` reports as its state (r17 unused); protects the person's files"}, {"n": 7, "text": "**When** an existing feature file is changed, `formulating-features` shall keep every scenario not added, changed or removed byte for byte as it was, tags included.", "prev": "[r7] **When** an existing feature file is changed, every scenario not added, changed or removed is byte for byte as it was, tags included.", "kind": "reworded", "answer": "r7: r7 \u2014 unchanged meaning; seen: a formulator in the kb run dropped a scenario (records/measurements/fixture-runs/2026-09-30-migrating-to-capabilities-test-log.md)"}, {"n": 9, "text": "`formulating-features` shall formulate a line every call must keep as one scenario per reason the line gives, each with one representative call.", "prev": "[r9] A line every call must keep is formulated as one scenario per reason the line gives, each with one representative call.", "kind": "reworded", "answer": "r9: r9 \u2014 unchanged meaning"}, {"n": 10, "text": "**When** the person rules a scenario that a work-item's implementer handed back with evidence a formulation question, `formulating-features` shall rewrite the scenario to fit its line and the evidence, or show the person a question with two readings.", "prev": "[r10] **When** a work-item's implementer hands back a scenario with evidence and the person rules it a formulation question, the scenario is rewritten to fit its line and the evidence, or a question with two readings goes to the person.", "kind": "reworded", "answer": "r10: r10 \u2014 unchanged meaning"}, {"n": 11, "text": "`formulating-features` shall tag each scenario, on its tag line, `@r<n>` for each line it formulates, the lines all of one capability, whatever the scenario's title.", "prev": "[r11] Each scenario has the tag `@r<n>` of the one line it formulates, on the scenario's tag line, and its title is free.", "kind": "reworded", "answer": "r11: r11 \u2014 as round 1: decision 0052's rule, several `@r<n>` tags, all of one capability"}, {"n": 13, "text": "**Where** `model check` can run, **when** feature files are committed, `model check` shall report no scenario that is not deprecated and names no line or lines of two capabilities, and no added or changed line without a scenario.", "prev": "[r13] **Where** `model check` can run, **when** feature files are committed, it reports no scenario that names no line or two, and no added or changed line without a scenario; **where** it cannot, the round says so and checks coverage by hand.", "kind": "reworded", "answer": "r13: r13 \u2014 the two reports joined (r19 unused); the fallback where `model check` cannot run moved to Implementation (r20, r21 unused)"}, {"n": 14, "text": "**When** a scenario uses a word its context's glossary avoids, `formulating-features` shall reword the scenario to its line through the small-change path, without a further gate.", "prev": "[r14] **When** a scenario uses a word its context's glossary avoids, the scenario is reworded to its line through the small-change path, without a further gate.", "kind": "reworded", "answer": "r14: r14 \u2014 unchanged meaning"}, {"n": 22, "text": "**If** `formulating-features` cannot do what it was asked, then `formulating-features` shall stop, saying why, and commit nothing.", "prev": null, "kind": "add", "answer": "New line."}]}, {"answer": "**Walking skeleton: 7 lines.** The cut round-1 lines are ideas to test, in the initiative's notes.", "key": "capability/migration-tools", "initiative": "ears", "release": "i13", "capability": "migration-tools", "file": "spec/capabilities/migration-tools.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** `migrate run --context <id>` is run, `migrate` shall move with git the old directories to the final layout: the decisions to `spec/decisions/`, `work/` to `.shop/work/`, and `records/` and `docs/superpowers/` to `.shop/records/`.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 2, "text": "**When** `migrate run` is run, `migrate` shall replace the ledger `spec/decisions.md` with one decision file for each of its entries under `spec/decisions/`.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 3, "text": "**When** `migrate run` is run, `migrate` shall make each `@holding` scenario a `@deprecated` one, rebinding the tests that name it by title.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 4, "text": "**When** `migrate run` is run, `migrate` shall give `spec/index.md` the context's id, each Behaviour line without one an `[r<n>]`, and each capability, decision file and moved record its id on the final layout.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 5, "text": "**When** `migrate run` moves a file or changes an id, `migrate` shall rewrite each reference to it in the repository's tracked text files.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 6, "text": "**When** `migrate run` has run on a repository on the old system, `migrate` shall have left it so that `model check` reports no violation, unresolved reference or file problem.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 7, "text": "**If** `migrate` cannot make every change it was asked to, then `migrate` shall exit non-zero, naming each change it could not make, and change no file.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}]}, {"answer": "**Walking skeleton: 8 lines.** The cut round-1 lines are ideas to test, in the initiative's notes.", "key": "capability/planning", "initiative": "ears", "release": "i13", "capability": "planning", "file": "spec/capabilities/planning.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** the planner is started on a work-item, the planner shall write a plan to the plan file its brief names.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 2, "text": "**When** the planner writes the plan, the planner shall state in it each decision the capability's Behaviour leaves open, with the requirement or design-decision it rests on.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 3, "text": "**When** the planner writes the plan, the planner shall list in it each test a decision of the plan breaks, with what becomes of it.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 4, "text": "The planner shall put in the plan no code block, file contents, diff or step-definition body.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 5, "text": "**When** planning ends, the planner shall write the result file with the status `DONE` or `QUESTION` and the final file set.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 6, "text": "**If** a decision would change what the capability's narrator observes and no requirement or design-decision settles it, then the planner shall give the result `QUESTION`, with the question and its readings.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 7, "text": "**While** planning, the planner shall change no file but the plan and the result file.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 8, "text": "**If** the planner cannot do what it was asked, then the planner shall hand back with the result `NEEDS_CONTEXT`, saying why.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}]}, {"answer": "**19 lines \u2192 14.**\n**Open choices:**\n1. r3 and r5 each join many conditions into one line, as the rule for one response asks. Choice: as written; the\n   alternative is a table of stop conditions (condition | result), which decision 0051 allows only for a check.\n2. r7, r9, r37: a state the response leaves (\"the work so far committed\", \"at a green commit\") is written in the\n   response rather than as a second \"shall\". Choice: as written.", "key": "capability/red-green", "initiative": "ears", "release": "i13", "capability": "red-green", "file": "spec/capabilities/red-green.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** the implementer reports a work-item done, the implementer shall have every scenario the work-item accepts, and everything that passed in the suite record its brief gives, passing.", "prev": "[r1] **When** a work-item is done, every scenario it accepts passes, and so does everything that passed in the suite record its brief gives.", "kind": "reworded", "answer": "r1: r1 \u2014 the two passing conditions are one response again (r20 unused)"}, {"n": 2, "text": "The implementer shall not commit a change to a `.feature` file or to a file under `.shop/work/`, except removing, with `features retire`, a deprecated scenario the work-item lists under Retires.", "prev": "[r2] No commit of an implementer changes a `.feature` file, except removing, with `features retire`, a deprecated scenario the work-item lists under Retires.\n[r19] No commit of an implementer changes a file under `.shop/work/`.", "kind": "reworded", "answer": "r2: r2 \u2014 joined with r19: one \"shall not commit a change to\" for both kinds of file; r19: retired \u2192 r2"}, {"n": 3, "text": "**If** a scenario the work-item accepts passes before any code is written for it or can only fail on setup, the work-item's check passes before any work is done, a scenario of a work-item not yet claimed passes, a Then line can only pass through code that contradicts it, or going green needs work that no scenario of the work-item describes and its plan does not name, beyond a trivial helper, then the implementer shall hand back.", "prev": "[r3] **If** a scenario the work-item accepts passes before any code is written for it, its check passes before any work, or a scenario of a work-item not yet claimed passes early, the implementer hands back.\n[r4] **If** a Then line can only pass through code that contradicts it, or a scenario can only fail on setup, the implementer hands back.\n[r12] **If** going green needs work that no scenario of the work-item describes and its plan does not name, beyond a trivial helper, the implementer hands back.", "kind": "reworded", "answer": "r3: r3 \u2014 every hand-back condition in one line (same response): r3's three, r4's two, r12's. Kept: the capability's purpose (stops when a scenario cannot be satisfied honestly); an early pass was seen suite-wide (records/archive/design-notes/2026-10-11-green-suite-design.md); r4: retired \u2192 r3; r12: retired \u2192 r3"}, {"n": 5, "text": "**If** an existing test could stay green only by being removed, loosened, skipped or rewritten to assert something else and the work-item's plan does not list it, a previously green scenario breaks and fixing it would change what a step means, the work needs a decision the plan, its rulings and the capability's Behaviour leave open, or a file would cross the repository's size limit with no rule in `CLAUDE.md` saying where the code goes, then the implementer shall stop `BLOCKED`, naming the test, step, decision or file.", "prev": "[r5] **If** an existing test could stay green only by being removed, loosened, skipped or rewritten to assert something else, and the work-item's plan does not list it, the implementer stops `BLOCKED` naming the test.\n[r13] **If** a previously green scenario breaks and fixing it would change what a step means, the implementer stops `BLOCKED`.\n[r14] **If** the work needs a decision the plan, its rulings and the capability's Behaviour leave open, or a file would cross the repository's size limit with no rule in `CLAUDE.md` saying where the code goes, the implementer stops `BLOCKED` with the specifics.", "kind": "reworded", "answer": "r5: r5 \u2014 every `BLOCKED` stop with the same response joined: r5's, r13's, r14's; \"naming the test\" widened to the test, step, decision or file. Kept: four hand-backs for an unlisted test in kb batches 33\u201335, and slice 156 removing tests to stay green (records/archive/design-notes/2026-10-11-rules-adjusted-design.md, 2026-10-10-small-slices-and-steps-design.md); r13: retired \u2192 r5; r14: retired \u2192 r5"}, {"n": 6, "text": "**When** the implementer changes a test's setup without touching what it asserts, or rewrites a test first committed after the initiative's base, the implementer shall name the test in its report.", "prev": "[r6] **When** the implementer changes a test's setup without touching what it asserts, or rewrites a test first committed after the initiative's base, its report names each such test.", "kind": "reworded", "answer": "r6: r6 \u2014 the two triggers joined (r24 unused)"}, {"n": 7, "text": "**When** the implementer hands back, the implementer shall return the result `HAND-BACK` with the stop condition and its evidence verbatim, the work so far committed on the work-item's branch.", "prev": "[r7] **When** the implementer hands back, its result is `HAND-BACK` with the stop condition, the evidence verbatim and which scenarios are green and red, and the work so far is committed on the work-item's branch.", "kind": "reworded", "answer": "r7: r7 \u2014 the commit of the work so far is the result's state, not a second response (r25 unused); \"which scenarios are green and red\" moved to Implementation"}, {"n": 9, "text": "**If** the work needs more than 15 files touched, then the implementer shall stop with the result `PARTIAL` at a green commit, having touched only the files it named in its report before its first edit.", "prev": "[r9] **If** the work needs more than 15 files touched, the implementer names in its report, before any edit, the files this worker will touch, touches only those, stops at a green commit with the result `PARTIAL`, and a new implementer can continue from the report.", "kind": "reworded", "answer": "r9: r9 \u2014 one response, the `PARTIAL` stop, with the files named before the first edit as its state; \"a new implementer can continue\" is the continuation in Implementation (r27\u2013r29 unused). Kept: slice 156 of kb touched 72 files in one dispatch (2026-10-10-small-slices-and-steps-design.md)"}, {"n": 10, "text": "**When** the scenarios are silent about a case, the implementer shall name the case in its report as an open question, leaving its behaviour unchosen by the code.", "prev": "[r10] **When** the scenarios are silent about a case, the code does not choose its behaviour and the report names it as an open question.", "kind": "reworded", "answer": "r10: r10 \u2014 one response (r30 unused)"}, {"n": 11, "text": "**When** the plan contains code, the implementer shall not paste it.", "prev": "[r11] **When** the plan contains code, the implementer does not paste it and says so in the report.", "kind": "reworded", "answer": "r11: r11 \u2014 \"says so in the report\" moved to Implementation (r31 unused)"}, {"n": 15, "text": "**If** the implementer cannot do what its brief asks, then the implementer shall stop with the result `NEEDS_CONTEXT`, saying why.", "prev": "[r15] **If** the brief names no scripts directory or no result file, or `bdd-red-green` is not in the implementer's context, the implementer stops `NEEDS_CONTEXT`.", "kind": "reworded", "answer": "r15: r15 \u2014 now the general line for the implementer; its three cases (no scripts directory, no result file, `bdd-red-green` missing) moved to Implementation as the cases seen (r33, r34 unused)"}, {"n": 16, "text": "The implementer shall end every run with a result whose status is one of `DONE`, `DONE_WITH_CONCERNS`, `PARTIAL`, `BLOCKED`, `HAND-BACK`, `NEEDS_CONTEXT`.", "prev": "[r16] Every result's status is one of `DONE`, `DONE_WITH_CONCERNS`, `PARTIAL`, `BLOCKED`, `HAND-BACK`, `NEEDS_CONTEXT`, and its summary is under fifteen lines.", "kind": "reworded", "answer": "r16: r16 \u2014 the summary under fifteen lines moved to Implementation (r35 unused)"}, {"n": 17, "text": "**When** the work needs a file outside the work-item's file set, the implementer shall claim it with `work claim` before editing it.", "prev": "[r17] **If** the work needs a file outside the work-item's file set, the implementer claims it with `work claim` before editing it. **If** the claim is refused, it commits what is green and stops `BLOCKED`, naming the file and the work-item whose claim has it.", "kind": "reworded", "answer": "r17: r17, r37 \u2014 the claim is event-driven (r17); its refusal keeps round 1's r37: it protects another work-item's claimed files. \"Commits what is green\" is the stop's state, \"at a green commit\" (r36 unused)"}, {"n": 18, "text": "The implementer shall work only in the worktree and on the branch its brief names, pushing, merging, rebasing and resetting nothing.", "prev": "[r18] The implementer works only in the worktree and on the branch its brief names, and never pushes, merges, rebases or resets.", "kind": "reworded", "answer": "r18: r18 \u2014 one response (r38 unused)"}, {"n": 37, "text": "**If** the implementer's claim of a file is refused, then the implementer shall stop `BLOCKED` at a green commit, naming the file and the work-item whose claim has it.", "prev": "[r17] **If** the work needs a file outside the work-item's file set, the implementer claims it with `work claim` before editing it. **If** the claim is refused, it commits what is green and stops `BLOCKED`, naming the file and the work-item whose claim has it.", "kind": "add", "answer": "r17: r17, r37 \u2014 the claim is event-driven (r17); its refusal keeps round 1's r37: it protects another work-item's claimed files. \"Commits what is green\" is the stop's state, \"at a green commit\" (r36 unused)"}]}, {"answer": "**14 lines \u2192 9.**\n**Open choices:**\n1. The table's lead sentence carries no id; only its rows are requirements. Choice: as written.", "key": "capability/review", "initiative": "ears", "release": "i13", "capability": "review", "file": "spec/capabilities/review.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** a review ends, the reviewer shall leave its findings in the findings file and the result file its brief names, and the working tree, index, HEAD and branches as they were.", "prev": "[r1] **When** a review ends, its findings are in the findings file and the result file the brief names, and the working tree, index, HEAD and branches are as they were.", "kind": "reworded", "answer": "r1: r1 \u2014 one response, the state the review leaves (r15 unused)"}, {"n": 2, "text": "The task and branch reviewers shall grade every finding Critical, Important or Minor.", "prev": "[r2] **When** a task or branch review ends, every finding is graded Critical, Important or Minor and gives its file and line, what is wrong, why it matters and the fix.", "kind": "reworded", "answer": "r2: r2 \u2014 the grade only; a finding's file and line, what, why and fix moved to Implementation (r16 unused)"}, {"n": 7, "text": "**When** a branch review ends, the branch reviewer shall report the suite's wall time, the code's shape against `CLAUDE.md` and its coupling to the projects it depends on.", "prev": "[r7] **When** a branch review ends, it reports the suite's wall time and checks the code's shape against `CLAUDE.md` and its coupling to the projects it depends on.", "kind": "reworded", "answer": "r7: r7 \u2014 one \"report\" of the three (r20, r21 unused)"}, {"n": 8, "text": "**When** the re-review of a fix work-item finds something other than data left invalid, the system's own fault on input, or a write that lands where a refusal belongs, the reviewer shall triage it as an observation.", "prev": "[r8] **When** the re-review of a fix work-item finds something other than data left invalid, the system's own fault on input, or a write that lands where a refusal belongs, it is triaged as an observation.", "kind": "reworded", "answer": "r8: r8 \u2014 unchanged meaning"}, {"n": 9, "text": "**Where** the system reviewed has a dry run and a real run of one operation, the branch reviewer shall run the randomized test that they agree.", "prev": "[r9] **Where** the system has a dry run and a real run of one operation, the branch review runs the randomized test that they agree.", "kind": "reworded", "answer": "r9: r9 \u2014 unchanged meaning"}, {"n": 12, "text": "The reviewer shall triage each finding, naming the work-item whose commits contain it, as fix now for a wrong answer, a crash where a refusal belongs or lost data, as an observation, with its reproduction, for hardening, or as drop for polish that is not cheap.", "prev": "[r12] Each finding names the work-item whose commits contain it and its triage: fix now for a wrong answer, a crash where a refusal belongs or lost data; observation for hardening, with its reproduction; or drop for polish that is not cheap.", "kind": "reworded", "answer": "r12: r12 \u2014 the triage and its three cases in one line again (r22\u2013r25 unused)"}, {"n": 13, "text": "The reviewer shall read, for a task review, the commits of one work-item and its plan, and for a branch review, the initiative branch from its base and every work-item of the initiative.", "prev": "[r13] A task review reads the commits of one work-item and its plan; a branch review reads the initiative branch from its base and every work-item of the initiative.", "kind": "reworded", "answer": "r13: r13 \u2014 both kinds of review in one line (r26 unused)"}, {"n": 14, "text": "**When** the architecture reviewer finds a refactor to call for, the architecture reviewer shall give it as an observation with a check that would show it done, naming the work-item it would unblock, if any.", "prev": "[r14] **When** the architecture reviewer finds a refactor to call for, it gives it as an observation with a check that would show it done, and names the work-item it would unblock, if any.", "kind": "reworded", "answer": "r14: r14 \u2014 \"names the work-item it would unblock\" as the response's manner (r27 unused)"}, {"n": 28, "text": "**If** a reviewer cannot do what its brief asks, then the reviewer shall hand back, saying why, and change nothing.", "prev": null, "kind": "add", "answer": "New line."}]}, {"answer": "**6 lines \u2192 6.**\n**Open choices:**\nNone open.", "key": "capability/role-boundaries", "initiative": "ears", "release": "i13", "capability": "role-boundaries", "file": "spec/capabilities/role-boundaries.md", "status": "drafted", "lines": [{"n": 1, "text": "The plugin's agent definitions shall let only `initiative-round` start another agent.", "prev": "[r1] Only `initiative-round` can start another agent.", "kind": "reworded", "answer": "r1: r1 \u2014 unchanged meaning"}, {"n": 2, "text": "The plugin's agent definitions shall give no reviewer, no scout and no planner the Edit tool.", "prev": "[r2] No reviewer, no scout and no planner has the Edit tool.", "kind": "reworded", "answer": "r2: r2 \u2014 unchanged meaning"}, {"n": 3, "text": "The plugin's agent definitions shall give the `capability-writer` and the `feature-formulator` no edit and no shell tool.", "prev": "[r3] The `capability-writer` and the `feature-formulator` have no edit and no shell tool.", "kind": "reworded", "answer": "r3: r3 \u2014 unchanged meaning"}, {"n": 4, "text": "The plugin's agent definitions shall give the implementer only the skills listed under its `skills:`, `bdd-red-green` always among them, and no Skill tool.", "prev": "[r4] The implementer's skills are the ones its definition lists under `skills:`, `bdd-red-green` always among them; it has no Skill tool, so the listing of every installed skill never enters its context.", "kind": "reworded", "answer": "r4: r4 \u2014 the implementer's skill set in one response (r7, r8 unused); \"so the listing of every installed skill never enters its context\" is the consequence, moved to Implementation (r9 unused)"}, {"n": 5, "text": "The plugin's agent definitions shall name each agent's model: Opus for the spec writers, the planner and the reviewers, Sonnet for the implementer and `initiative-round`, Haiku for the scout.", "prev": "[r5] Each agent names its model: Opus for the spec writers, the planner and the reviewers, Sonnet for the implementer and `initiative-round`, Haiku for the scout.", "kind": "reworded", "answer": "r5: r5 \u2014 the models in one response (r10\u2013r12 unused)"}, {"n": 6, "text": "The plugin's agent definitions shall give the `bdd-planner` no shell tool.", "prev": "[r6] The `bdd-planner` has no shell tool.", "kind": "reworded", "answer": "r6: r6 \u2014 unchanged meaning"}]}, {"answer": "**11 lines \u2192 12.**\n**Open choices:**\n1. r4: \"report mode\" is not defined elsewhere in the lines; read as an option (Where), the counterpart of fix\n   mode. Choice: as written (open since round 1).", "key": "capability/spec-consistency", "initiative": "ears", "release": "i13", "capability": "spec-consistency", "file": "spec/capabilities/spec-consistency.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** the person asks for a consistency check, `checking-spec-consistency` shall run `model check` before anything else and report its `v_t1`, `v_t2` and `v_t3` rows as findings.", "prev": "[r1] **When** the person asks for a consistency check, the session runs `model check` first and reports its `v_t1`, `v_t2` and `v_t3` rows as findings.", "kind": "reworded", "answer": "r1: r1 \u2014 run and report in one response (r12 unused)"}, {"n": 2, "text": "**When** the check starts, `checking-spec-consistency` shall state how many `spec-checker` dispatches it will make, one for each capability and one for the whole context, before it dispatches any.", "prev": "[r2] **When** the check starts, the session states how many `spec-checker` dispatches it will make, one for each capability and one for the whole context, before it dispatches any.", "kind": "reworded", "answer": "r2: r2 \u2014 unchanged meaning"}, {"n": 3, "text": "**When** a `spec-checker` is dispatched, the `spec-checker` shall read only `spec/` and `features/`, never the source.", "prev": "[r3] **When** a `spec-checker` is dispatched, it reads only `spec/` and `features/`, never the source, and writes its findings to a file under the drafts path and replies with a short summary.", "kind": "reworded", "answer": "r3: r3 \u2014 the blind reading only; writing the findings file and the short reply moved to Implementation (r13, r14 unused)"}, {"n": 4, "text": "**Where** the check runs in report mode, **when** the check ends, `checking-spec-consistency` shall have changed nothing but one findings file, each finding in it naming its ids.", "prev": "[r4] **When** the check ends in report mode, the session writes one findings file grouped by term cluster, then lines with two readings, then other drift, each finding naming its ids, and changes nothing else.", "kind": "reworded", "answer": "r4: r4 \u2014 one response, the state report mode leaves (r15 unused); the findings file's grouping moved to Implementation"}, {"n": 5, "text": "**Where** fix mode is asked for, `checking-spec-consistency` shall first propose, for each term cluster, a glossary entry with its `Not:` words, and put it, with the line changes that apply it, ids kept, through one gate pass for the term.", "prev": "[r5] **Where** fix mode is asked for, the session first proposes, for each term cluster, a glossary entry with its `Not:` words, and on the person's yes puts the entry and the line changes that apply it, ids kept, through one gate pass for the term.", "kind": "reworded", "answer": "r5: r5 \u2014 proposal and its gate pass in one response (r16 unused)"}, {"n": 6, "text": "**Where** fix mode is asked for, **when** the terms are settled, `checking-spec-consistency` shall have a scenario that uses an avoided word reworded to its line through formulation's small-change path, with no further approval.", "prev": "[r6] **Where** fix mode is asked for, **when** the terms are settled, a scenario that uses an avoided word is reworded to its line through formulation's small-change path, with no further approval.", "kind": "reworded", "answer": "r6: r6 \u2014 unchanged meaning"}, {"n": 7, "text": "**Where** fix mode is asked for, **when** a line has two readings, `checking-spec-consistency` shall ask the person one question with its readings, to be integrated through the question path of `integrating-a-proposal`.", "prev": "[r7] **Where** fix mode is asked for, **when** a line has two readings, the session asks the person one question with its readings, and has the answer integrated through the question path of integrating-a-proposal.", "kind": "reworded", "answer": "r7: r7 \u2014 the question and its integration in one response (r17 unused)"}, {"n": 8, "text": "**Where** fix mode is asked for, **when** a finding is drift other than a term or a line with two readings, `checking-spec-consistency` shall ask the person which side is right, one finding at a time.", "prev": "[r8] **Where** fix mode is asked for, **when** a finding is drift other than a term or a line with two readings, the session asks the person which side is right, one finding at a time.", "kind": "reworded", "answer": "r8: r8 \u2014 unchanged meaning"}, {"n": 9, "text": "**Where** fix mode is asked for, **when** a step is done, `checking-spec-consistency` shall report what `model check` finds before the next step.", "prev": "[r9] **Where** fix mode is asked for, **when** a step is done, the session runs `model check` and reports what it found before the next step.", "kind": "reworded", "answer": "r9: r9 \u2014 \"runs `model check` and reports\" as one report of what it finds (r18 unused)"}, {"n": 10, "text": "**When** every finding is applied, rejected or recorded as an observation, `checking-spec-consistency` shall end fix mode with `model check` reporting no `v_t1`, `v_t2` or `v_t3` row.", "prev": "[r10] **When** every finding is applied, rejected or recorded as an observation, fix mode ends and `model check` reports no `v_t1`, `v_t2` or `v_t3` row.", "kind": "reworded", "answer": "r10: r10 \u2014 one response, fix mode ending in that state (r19 unused)"}, {"n": 11, "text": "`checking-spec-consistency` shall run only when the person asks for it, never in an integration or formulation round.", "prev": "[r11] **Where** an integration or formulation round runs, it does not run the consistency check; the check runs when the person asks for it.", "kind": "reworded", "answer": "r11: r11 \u2014 one ubiquitous line: only on demand, never in a round (r20 unused)"}, {"n": 21, "text": "**If** `checking-spec-consistency` cannot do what it was asked, then `checking-spec-consistency` shall stop, saying why, and change nothing.", "prev": null, "kind": "add", "answer": "New line."}]}, {"answer": "**22 lines \u2192 20.**\n**Open choices:**\nNone open.", "key": "capability/spec-integration", "initiative": "ears", "release": "i13", "capability": "spec-integration", "file": "spec/capabilities/spec-integration.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** an approved note is integrated, `integrating-a-proposal` shall show the person every added, changed and removed Behaviour line, each with its id, and every question the note left open, each with the lines its answers would give.", "prev": "[r1] **When** an approved note is integrated, the session shows the person every added, changed and removed Behaviour line, each with its id, and every question the note left open, each question with the lines its answers would give.", "kind": "reworded", "answer": "r1: r1 \u2014 lines and questions in one \"show\" (r23 unused)"}, {"n": 2, "text": "**When** a line drafted from a note quotes no sentence of the note, `integrating-a-proposal` shall show it to the person as a question, not as a line.", "prev": "[r2] **Where** the change comes from a note, a drafted line that quotes no sentence of the note is shown to the person as a question, not as a line.", "kind": "reworded", "answer": "r2: r2 \u2014 When again, not If: drafting a line no sentence backs is the writer's draft, not a fault of the skill; \"Where the change comes from a note\" is in the trigger"}, {"n": 3, "text": "**While** the person has not said yes to the lines and answered every question, `integrating-a-proposal` shall change nothing under `spec/`.", "prev": "[r3] **While** the person has not said yes to the lines and answered every question, nothing under `spec/` changes.", "kind": "reworded", "answer": "r3: r3 \u2014 unchanged meaning; protects `spec/`"}, {"n": 4, "text": "**When** the person answers a question, `integrating-a-proposal` shall show the changed lines again, the answer drafted as a further round, before anything is written.", "prev": "[r4] **When** the person answers a question, the answer is drafted as a further round and the changed lines are shown again before anything is written.", "kind": "reworded", "answer": "r4: r4 \u2014 one response, the changed lines shown again (r24 unused)"}, {"n": 6, "text": "**When** the person says yes, `integrating-a-proposal` shall commit the approved drafts to `spec/` alone, with the Behaviour lines exactly as approved.", "prev": "[r5] **If** the person rejects a line, that line is not written to `spec/`.\n[r6] **When** the person says yes, the approved drafts are applied to `spec/`, with the Behaviour lines exactly as approved, and committed alone, with the approval and its date in the commit message.", "kind": "reworded", "answer": "r5: retired \u2192 r6 \u2014 a rejected line is not approved, and r6 writes the lines exactly as approved; r6: r6 \u2014 apply and commit alone, one response; the commit message's contents moved to r15 (r25 unused)"}, {"n": 7, "text": "**When** a note would start a second spec in a context that has one, `integrating-a-proposal` shall integrate it into the existing `spec/` instead.", "prev": "[r7] **When** a note would start a second spec in a context that has one, the session integrates it into the existing `spec/` instead.", "kind": "reworded", "answer": "r7: r7 \u2014 When again, not If: integrating into the one spec is the normal path"}, {"n": 8, "text": "**Where** a change adds or changes at most two Behaviour lines in existing capabilities, changes no published contract and leaves nothing unknown, `integrating-a-proposal` shall write the lines itself from `spec/` alone.", "prev": "[r8] **Where** a change adds or changes at most two Behaviour lines in existing capabilities, changes no published contract and leaves nothing unknown, the session writes the lines itself from `spec/` alone and still stops at the gate before writing them.", "kind": "reworded", "answer": "r8: r8 \u2014 \"still stops at the gate\" is r3 (r26 unused)"}, {"n": 10, "text": "**When** an integration is started in the session that brainstormed the note, `integrating-a-proposal` shall recommend a new session for the integration before starting it, saying that this session brainstormed the note.", "prev": "[r10] **When** this session is the one that brainstormed the note, it says so and recommends a new session for the integration before starting it.", "kind": "reworded", "answer": "r10: r10 \u2014 unchanged meaning"}, {"n": 11, "text": "**When** integration is applied, `integrating-a-proposal` shall hand the changed capabilities to formulation.", "prev": "[r11] **When** integration is applied, the session hands the changed capabilities to formulation.", "kind": "reworded", "answer": "r11: r11 \u2014 unchanged meaning"}, {"n": 12, "text": "**When** a line is added to a capability, `integrating-a-proposal` shall give it the id one above every id the capability has used or retired, wherever the line sits in the section.", "prev": "[r12] **When** a line is added to a capability, it takes the id one above every id the capability has used or retired, wherever the line sits in the section.", "kind": "reworded", "answer": "r12: r12 \u2014 unchanged meaning; \"no later line takes it\" (r28 unused) is r12's \"one above every id \u2026 retired\""}, {"n": 13, "text": "**When** a line is changed, `integrating-a-proposal` shall keep its id.", "prev": "[r13] **When** a line is changed, it keeps its id.", "kind": "reworded", "answer": "r13: r13 \u2014 unchanged meaning"}, {"n": 14, "text": "**When** a line is removed, `integrating-a-proposal` shall add its id to the capability's `retired` list.", "prev": "[r14] **When** a line is removed, its id is added to the capability's `retired` list and no later line takes it.", "kind": "reworded", "answer": "r14: r14 \u2014 as r12 says"}, {"n": 15, "text": "**When** the approved drafts are committed, `integrating-a-proposal` shall name in the commit message the approval and its date, any delegation it was given under, and each id and each glossary term added, changed and removed.", "prev": "[r9] **Where** the person has delegated decisions to the session's recommendations, the commit, and the decision's `by` where the change is a decision, say that the lines were approved under that delegation.\n[r15] **When** the approved drafts are committed, the commit message names each id added, changed and removed.\n[r18] **When** the approved drafts are committed, the commit message names each term added, changed and removed.", "kind": "reworded", "answer": "r9: retired \u2192 r15 \u2014 the delegation named in the commit message (r15) and in the decision's `by` (r21); r27 unused; r15: r15 \u2014 joined with r9's commit half and r18: one line for what the commit message names; r18: retired \u2192 r15"}, {"n": 16, "text": "**Where** `model check` can run, **if** applying the approved drafts makes it report a new problem other than an added line with no scenario yet, a removed line's scenario that now names no line, or a scenario that uses a word the new glossary entry avoids, then `integrating-a-proposal` shall not commit them.", "prev": "[r16] **Where** `model check` can run, **when** the approved drafts are applied, the only new problems it may report are: an added line with no scenario yet, a removed line's scenario that now names no line, and a scenario that uses a word the new glossary entry avoids; formulation clears all three, and any other new problem stops the commit.", "kind": "reworded", "answer": "r16: r16 \u2014 as round 1: protects `spec/` from a commit that breaks the model. \"formulation clears all three\" (r29 unused) is formulation's work, not this capability's"}, {"n": 17, "text": "**Where** a repository keeps `.shop/work/`, **when** a glossary term is changed, `integrating-a-proposal` shall put the change with the capability-proposal that needs it, listing the term in its `adds`, `changes` or `removes`.", "prev": "[r17] **Where** a repository keeps `.shop/work/`, a change to a glossary term rides with the capability-proposal that needs it, which lists the term in `adds`, `changes` or `removes`.", "kind": "reworded", "answer": "r17: r17 \u2014 unchanged meaning"}, {"n": 19, "text": "**Where** a repository has no `.shop/work/`, **when** a glossary change is drafted, `integrating-a-proposal` shall put it through the gate like a Behaviour line.", "prev": "[r19] **Where** a repository has no `.shop/work/`, **when** a glossary change is drafted, the session shows it to the person like a Behaviour line and writes nothing to `spec/` before the person says yes.", "kind": "reworded", "answer": "r19: r19 \u2014 one response, the gate (r30 unused)"}, {"n": 20, "text": "**When** a change makes a decision, `integrating-a-proposal` shall show it to the person as one file `spec/decisions/<nnnn>-<slug>.md`, `nnnn` one above the highest number in `spec/decisions/`.", "prev": "[r20] **When** a change makes a decision, the person is shown it as one file `spec/decisions/<nnnn>-<slug>.md`, `nnnn` one above the highest number in `spec/decisions/`, with a one-sentence summary and a Decision section, and a Context and Alternatives only where options were weighed.", "kind": "reworded", "answer": "r20: r20 \u2014 the decision's sections moved to Implementation (r31 unused), as decision 0046 states them"}, {"n": 21, "text": "**When** a drafted decision names what it came from, `integrating-a-proposal` shall list by id in its `source` only records, initiatives and decisions, writing the person, a date, a delegation or anything outside the repository in its `by`.", "prev": "[r21] **When** a drafted decision names what it came from, its `source` lists records, initiatives or decisions by id, and the person, a date, a delegation or anything outside the repository is written in its `by`.", "kind": "reworded", "answer": "r21: r21 \u2014 `source` and `by` in one line again (r32 unused)"}, {"n": 22, "text": "**When** the approved drafts are committed with a decision, `integrating-a-proposal` shall commit in the same commit the `spec/decisions/index.md` that `model decisions` writes.", "prev": "[r22] **When** the approved drafts are committed with a decision, `spec/decisions/index.md` is the one `model decisions` writes, in the same commit.", "kind": "reworded", "answer": "r22: r22 \u2014 unchanged meaning"}, {"n": 33, "text": "**If** `integrating-a-proposal` cannot do what it was asked, then `integrating-a-proposal` shall stop, saying why, and change nothing under `spec/`.", "prev": null, "kind": "add", "answer": "New line."}]}, {"answer": "**23 lines \u2192 21.**\n**Open choices:**\n1. r1 as the general line keeps \"before any change\": a failure found after the mechanical move cannot stop before\n   it. Choice: as written, since r26 and r6 cover what follows the move; the alternative is a separate general\n   line \"stop, saying why, and change nothing further\".\n2. r26 \"change nothing beyond the mechanical move\" replaces r2's \"nothing under `spec/` changes before their yes\"\n   and r16's \"nothing after the mechanical move is committed\": nothing written, not only nothing committed.\n   Choice: as written.", "key": "capability/spec-migration", "initiative": "ears", "release": "i13", "capability": "spec-migration", "file": "spec/capabilities/spec-migration.md", "status": "drafted", "lines": [{"n": 1, "text": "**If** the working tree is not clean, a work-item is `claimed`, the suite does not run cleanly, or `migrating-to-capabilities` cannot otherwise do what it was asked, then `migrating-to-capabilities` shall stop before any change, saying why.", "prev": "[r1] **If** the working tree is not clean, a work-item is `claimed`, or the suite does not run cleanly, migration stops before any change and says which.", "kind": "reworded", "answer": "r1: r1 \u2014 the three conditions joined again (r24, r25 unused) and made the skill's general line (\"cannot otherwise do what it was asked\"); protects the person's uncommitted work"}, {"n": 2, "text": "**When** migration stops at its gate, `migrating-to-capabilities` shall show the person the capabilities, which old features' scenarios each receives, every line no scenario backs, every scenario that formulates no line, each pair of scenarios with one title that would land in one capability (asking to retitle one), and every other question.", "prev": "[r2] **When** migration drafts the spec, the person is shown the capabilities, which old features' scenarios each receives, every line no scenario backs, and every question, and nothing under `spec/` changes before their yes.\n[r3] **If** two scenarios with one title would land in one capability, the person is asked to retitle one at the gate.\n[r12] **If** a scenario formulates no line or more than one, migration to ids shows it to the person at the gate as a question and tags nothing before the answer.", "kind": "reworded", "answer": "r2: r2, r26 \u2014 what the gate shows of the spec, with r3's and r12's questions (r2); nothing beyond the mechanical move changed before the answers, joined with r16's half (r26, round 1's id); r3: retired \u2192 r2 \u2014 the retitle is asked at the gate. Seen: the cart fixture's two \"An empty cart\" scenarios (records/measurements/fixture-runs/2026-09-30-migrating-to-capabilities-test-log.md); r12: retired \u2192 r2 \u2014 a scenario that formulates no line is a question at the gate; \"tags nothing before the answer\" is r26 (r31 unused)"}, {"n": 4, "text": "**When** migration is done, `migrating-to-capabilities` shall have put each scenario in the one feature file named for its capability, its effective tags, title, description and tables, and its Background steps followed by its own steps, as they were, the new `@r<n>` tags aside.", "prev": "[r4] **When** migration is done, each capability has one feature file named for it, with the scenarios mapped to it; each scenario's effective tags, title, description and tables, and its Background steps followed by its own steps, are as they were, the new `@r<n>` tags aside.", "kind": "reworded", "answer": "r4: r4 \u2014 one response, each scenario put in its file as it was (r27 unused)"}, {"n": 5, "text": "**When** migration onto `spec/` or to ids is done, `migrating-to-capabilities` shall have left the suite's summary, its passing scenarios by title and its count of scenarios per tag equal to those before it, the retitles approved at the gate, the new `@r<n>` tags, the deprecations the gate led to, and the \" (deprecated)\" titles of those and of r18's renaming aside.", "prev": "[r5] **When** migration is done, the suite's summary, its passing scenarios by title and its count of scenarios per tag equal those before it, retitles approved at the gate and the new `@r<n>` tags aside.\n[r13] **When** migration onto `spec/` or to ids is done, the suite's summary, its passing scenarios by title and its count of scenarios per tag equal those before it, the new `@r<n>` tags, the deprecations the gate led to, and the \" (deprecated)\" titles of those and of r18's renaming aside.", "kind": "reworded", "answer": "r5: r5 \u2014 joined with r13, which sets aside more and covers migration to ids too; r13: retired \u2192 r5"}, {"n": 6, "text": "**If** the suite's summary, its passing scenarios by title or its count of scenarios per tag differ from those before migration beyond what r5 sets aside, then `migrating-to-capabilities` shall stop and report the difference without editing a scenario.", "prev": "[r6] **If** any of those differ beyond what they set aside, migration stops and reports the difference without editing a scenario.", "kind": "reworded", "answer": "r6: r6 \u2014 unchanged meaning; protects the suite from silent damage"}, {"n": 7, "text": "`migrating-to-capabilities` shall change no step definition's body in a migration.", "prev": "[r7] No step definition's body changes in a migration.", "kind": "reworded", "answer": "r7: r7 \u2014 unchanged meaning"}, {"n": 8, "text": "**When** migration is done, `migrating-to-capabilities` shall have headed each note as a proposal integrated into `spec/` on its date.", "prev": "[r8] **When** migration is done, each note is headed as a proposal integrated into `spec/` on its date.", "kind": "reworded", "answer": "r8: r8 \u2014 unchanged meaning"}, {"n": 9, "text": "**Where** a repository has capability files whose Behaviour lines have no ids, **when** it is migrated to ids, `migrating-to-capabilities` shall give each line `[r<n>]` in its order from r1, its text unchanged, and each capability `retired: []` and the id `capability/<context path>/<name>`.", "prev": "[r9] **Where** a repository has capability files whose Behaviour lines have no ids, **when** it is migrated to ids, each line gets `[r<n>]` in its order from r1 with its text unchanged, each capability gets `retired: []`, and each capability's id becomes `capability/<context path>/<name>`.", "kind": "reworded", "answer": "r9: r9 \u2014 one \"give\" (r28, r29 unused)"}, {"n": 10, "text": "**When** a repository is migrated to ids, `migrating-to-capabilities` shall make its context's id `bounded-context/<context path>`, the owner's domain, product and context name that `spec/index.md` names or, where it names none, that the person gives at the gate.", "prev": "[r10] **When** a repository is migrated to ids, its context's id is `bounded-context/<context path>`, the context path being the owner's domain, product and context name the person gives at the gate, unless `spec/index.md` already names them.", "kind": "reworded", "answer": "r10: r10 \u2014 the context path from `spec/index.md` or the person in one line (r30 unused)"}, {"n": 11, "text": "**When** a repository is migrated onto `spec/` or to ids, `migrating-to-capabilities` shall give each scenario that is not deprecated the `@r<n>` tag of each line it formulates, and change nothing else in a scenario but the deprecations the gate led to and the renaming of r18.", "prev": "[r11] **When** a repository is migrated onto `spec/` or to ids, each scenario that is not deprecated gets the `@r<n>` tag of the line it formulates, and nothing else in a scenario changes but the deprecations the gate led to and the renaming of r18.", "kind": "reworded", "answer": "r11: r11 \u2014 as round 1: decision 0052's rule, the tag of each line the scenario formulates"}, {"n": 14, "text": "**When** a repository is migrated to ids, `migrating-to-capabilities` shall rewrite its `decision/<name>` references as `design-decision/<name>`, every frontmatter `id` under `spec/decisions/` and `.shop/` in full, and its observation headings `## obs/<x>` as `## observation/<context path>/<x>`, changing nothing else in a reference.", "prev": "[r14] **When** a repository is migrated to ids, its `decision/<name>` references become `design-decision/<name>`, every frontmatter `id` under `spec/decisions/` and `.shop/` is written in full, its observation headings `## obs/<x>` become `## observation/<context path>/<x>`, and nothing else in a reference changes.", "kind": "reworded", "answer": "r14: r14 \u2014 one \"rewrite\" (r32, r33 unused)"}, {"n": 15, "text": "**When** a repository is migrated, `migrating-to-capabilities` shall leave it on the final layout: decisions one file each in `spec/decisions/` with the generated `index.md`, work and records under `.shop/`, nothing of the plugin under `docs/superpowers/` or `.superpowers/`, and `migrate status` saying there is nothing left to migrate.", "prev": "[r15] **When** a repository is migrated, it ends on the final layout: decisions one file each in `spec/decisions/` with the generated `index.md`, work and records under `.shop/`, nothing of the plugin under `docs/superpowers/` or `.superpowers/`, and `migrate status` saying there is nothing left to migrate.", "kind": "reworded", "answer": "r15: r15 \u2014 unchanged meaning"}, {"n": 16, "text": "**When** migration stops at its gate, `migrating-to-capabilities` shall show the person each glossary bullet not in the glossary's form, each open slice of the living plan, and each backlog and log entry that would become an observation.", "prev": "[r16] **When** migration stops at the gate, the person is shown, besides r12's questions, each glossary bullet not in the glossary's form, each open slice of the living plan, and each backlog and log entry that would become an observation, and nothing after the mechanical move is committed before their answers.", "kind": "reworded", "answer": "r16: r16, r26 \u2014 what the gate shows of the work and the glossary (r16); its \"nothing committed before the answers\" joined into r26 (r34 unused)"}, {"n": 17, "text": "**When** migration is done, `migrating-to-capabilities` shall have turned the living plan into what the person kept at the gate: each open slice kept a work-item accepting the requirements its scenarios are tagged with, each slice dropped only in the archived plan, each entry not left out an observation, and the plan and its archives records under `.shop/records/archive/plans/`.", "prev": "[r17] **When** migration is done, each open slice the person kept is a work-item accepting the requirements its scenarios are tagged with, each slice the person dropped is only in the archived plan, each entry the person did not leave out is an observation, and the plan and its archives are records under `.shop/records/archive/plans/`.", "kind": "reworded", "answer": "r17: r17 \u2014 the living plan's conversion in one response (r35\u2013r37 unused)"}, {"n": 18, "text": "**When** migration is done, `migrating-to-capabilities` shall have tagged each scenario that was tagged `@holding` `@deprecated`, with \" (deprecated)\" for \" (held)\" on its title and `Deprecated for:` for `Held for:`, still bound by its test.", "prev": "[r18] **When** migration is done, each scenario that was tagged `@holding` is tagged `@deprecated`, with \" (deprecated)\" for \" (held)\" on its title and `Deprecated for:` for `Held for:`, and its test still binds it.", "kind": "reworded", "answer": "r18: r18 \u2014 \"still bound by its test\" as the response's state (r38 unused)"}, {"n": 19, "text": "**When** migration is done, `migrating-to-capabilities` shall have made each decision of the ledger a decision file with the entry's text as its summary and Decision, its `source` naming by id the records the files the entry named became.", "prev": "[r19] **When** migration is done, each decision of the ledger is a decision file with the entry's text as its summary and Decision, and its `source` names by id the records the files it named became.", "kind": "reworded", "answer": "r19: r19 \u2014 the `source` as the response's state (r39 unused)"}, {"n": 20, "text": "**When** migration is done, `migrating-to-capabilities` shall have left the repository with no violation, unresolved reference, file problem or `v_s3` (a requirement has no scenario) for `model check` to report, but a `v_s3` for a line that had no scenario before.", "prev": "[r20] **When** migration is done, `model check` reports no violation, unresolved reference or file problem, and no `v_s3` (a requirement has no scenario) but for lines that had no scenario before.", "kind": "reworded", "answer": "r20: r20 \u2014 unchanged meaning"}, {"n": 21, "text": "**When** migration is done, `migrating-to-capabilities` shall have put each glossary bullet in the glossary's form, in the words the person gave at the gate.", "prev": "[r21] **When** migration is done, each glossary bullet is in the glossary's form, in the words the person gave at the gate.", "kind": "reworded", "answer": "r21: r21 \u2014 unchanged meaning"}, {"n": 22, "text": "**When** migration is done, `migrating-to-capabilities` shall have made the mechanical move one commit, before the gate, in which no Behaviour line's text and no scenario but its renaming of r18 changes.", "prev": "[r22] **When** migration is done, the mechanical move is one commit, before the gate, in which no Behaviour line's text and no scenario but its renaming of r18 changes; the tags, work-items and observations the gate allowed are the next.", "kind": "reworded", "answer": "r22: r22 \u2014 \"the tags, work-items and observations \u2026 are the next [commit]\" moved to Implementation (r40 unused)"}, {"n": 23, "text": "**When** migration is done, `migrating-to-capabilities` shall show the person each file other than Markdown in which the migration rewrote a path it moved, with the line.", "prev": "[r23] **When** migration is done, the person is shown each file other than Markdown in which the migration rewrote a path it moved, with the line.", "kind": "reworded", "answer": "r23: r23 \u2014 unchanged meaning; protects the person's files from a silent path rewrite"}, {"n": 26, "text": "**While** the person has not answered at the gate, `migrating-to-capabilities` shall change nothing beyond the mechanical move.", "prev": "[r2] **When** migration drafts the spec, the person is shown the capabilities, which old features' scenarios each receives, every line no scenario backs, and every question, and nothing under `spec/` changes before their yes.\n[r16] **When** migration stops at the gate, the person is shown, besides r12's questions, each glossary bullet not in the glossary's form, each open slice of the living plan, and each backlog and log entry that would become an observation, and nothing after the mechanical move is committed before their answers.", "kind": "add", "answer": "r2: r2, r26 \u2014 what the gate shows of the spec, with r3's and r12's questions (r2); nothing beyond the mechanical move changed before the answers, joined with r16's half (r26, round 1's id); r16: r16, r26 \u2014 what the gate shows of the work and the glossary (r16); its \"nothing committed before the answers\" joined into r26 (r34 unused)"}]}, {"answer": "**Walking skeleton: 10 lines.** The cut round-1 lines are ideas to test, in the initiative's notes.", "key": "capability/supervision", "initiative": "ears", "release": "i13", "capability": "supervision", "file": "spec/capabilities/supervision.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** `work run <initiative>` is started, `work run` shall pull the initiative's work-items through research, plan, implementation and review, one worker at a time, until none can move.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 2, "text": "**When** a work-item is `drafted`, `researched`, `ready` or `done`, `work run` shall start a new `claude -p` session of that stage's agent (`code-scout`, `bdd-planner`, `bdd-implementer`, `bdd-task-reviewer`), given one brief file that names the work-item, the files to read and the result file.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 3, "text": "**When** a worker's result file gives `DONE`, `work run` shall move the work-item to its next status.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 4, "text": "**When** an implementer's result is `DONE`, `work run` shall merge its branch into the initiative branch only if the work-item's scenarios and the whole suite pass on it.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 5, "text": "**If** a worker gives any result but `DONE`, gives no result file, or its work fails the tests, then `work run` shall move the work-item to `awaiting-ruling`, with the worker's questions or the failure as its question.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 6, "text": "**If** a worker changes a file under `.shop/work/` outside its run directory, then `work run` shall put the file back as it was.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 7, "text": "**When** `work run` moves a work-item, `work run` shall commit the work-item's file, its run directory and `log.jsonl` on the initiative branch, and nothing else.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 8, "text": "**When** a worker starts or ends, `work run` shall append a line to `log.jsonl` with the time, the work-item, the stage, the agent and the session id.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 9, "text": "**When** no work-item can move, `work run` shall exit, printing each work-item's status and each open question.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 10, "text": "**If** `work run` cannot do what it was asked, then `work run` shall exit non-zero, say why, and change nothing.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}]}, {"answer": "**Walking skeleton: 7 lines.** The cut round-1 lines are ideas to test, in the initiative's notes.", "key": "capability/work-queue", "initiative": "ears", "release": "i13", "capability": "work-queue", "file": "spec/capabilities/work-queue.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** `work add <initiative> <name>` is run with `--part-of`, `--under` and `--accepts`, `work` shall write `.shop/work/<initiative>/<name>.md` as a `drafted` work-item with the fields given.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 2, "text": "**If** the work-item's file already exists, then `work add` shall leave the file as it was.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 3, "text": "**When** `work show` is run, `work` shall print each work-item of every initiative under `.shop/work/` with its status.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 4, "text": "**When** `work` moves a work-item, `work` shall write the new status into the work-item's file.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 5, "text": "**When** `work` moves a work-item, `work` shall append a line to `.shop/work/<initiative>/log.jsonl` with the time, the work-item, the status before and after, and who moved it.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 6, "text": "**If** a work-item's status in its file is not the last status `log.jsonl` gives it, then `work` shall refuse to move it, naming the file and both statuses.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 7, "text": "**If** `work` cannot do what it was asked, then `work` shall exit non-zero, say why, and change nothing.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}]}], "decisions": [{"key": "design-decision/missingmass.io/shopsystem/shopsystem-bdd/behaviour-lines-are-ears", "num": "0051", "title": "0051. Behaviour lines are EARS", "summary": "Every Behaviour line is one EARS requirement in one of EARS's patterns, with \\\"shall\\\", one system response, one sentence.", "decision": "Every Behaviour line is one EARS requirement, written in one of its patterns, in this order of clauses:\n\n- ubiquitous: `The <system> shall <response>.`\n- event-driven: `When <trigger>, the <system> shall <response>.`\n- state-driven: `While <state>, the <system> shall <response>.`\n- unwanted behaviour: `If <condition>, then the <system> shall <response>.`\n- optional feature: `Where <feature>, the <system> shall <response>.`\n- complex: the clauses combined, `Where`, then `While`, then one `When` or `If \u2026 then`, then the system and its response.\n\nThe pattern follows what starts the behaviour, not the wording it had: a response to a command, an input or an event is event-driven, with the trigger in its `When` clause; a refusal or a fault is unwanted behaviour, with its condition in `If \u2026 then`; behaviour that lasts for a period is state-driven; behaviour that depends on an option or configuration is optional; only what holds with no trigger at all is ubiquitous. The system is named in the line: a script (`model check`, `features`), an agent, or a skill. One \"shall\" and one response per line: a line with two responses is two lines. Conditions with the same response join in one line (`If A or B, then \u2026`). An `If` line earns its place only when it is the capability's purpose (a check that reports problems), protects the person's files from loss or silent damage, or answers a failure that has been seen; every other failure is covered by one line per script or agent (`If <system> cannot do what it was asked, then <system> shall exit non-zero, say why, and change nothing`), and a new failure seen in practice earns its own line from that evidence. A check's rules may be a table whose rows carry ids and count as lines. Message wording and minor refusals belong in \"Implementation, may change\". A capability not yet built is specified as a walking skeleton, a handful of lines, and grows from what running it shows (the person, 2026-10-19). The response is observable by the narrator, as before. This replaces the \"no shall, present indicative\" adaptation that docs/capability-format.md taught. The strict form goes back to the design model in shopsystem-knowledge after the migration release.", "answer": null, "file": "decisions/0051-behaviour-lines-are-ears.md"}, {"key": "design-decision/missingmass.io/shopsystem/shopsystem-bdd/a-scenario-may-name-several-requirements", "num": "0052", "title": "0052. A scenario may name several requirements", "summary": "A scenario names one or more requirements by @r<n> tags; every requirement is named by at least one scenario.", "decision": "A scenario names the requirements it shows by `@r<n>` tags, one or more, in the feature file of their capability. Every requirement is named by at least one scenario, and a scenario's tags are all of one capability. When a line is restructured into several EARS lines (design-decision/behaviour-lines-are-ears), its scenario names each of them and the number of scenarios does not change (the person, 2026-10-19).", "answer": null, "file": "decisions/0052-a-scenario-may-name-several-requirements.md"}], "commit": "26e0dd2"}</script>
<script>

function el(tag, attrs, ...kids){ const e=document.createElement(tag); for(const k in (attrs||{})){ if(k==="class") e.className=attrs[k]; else if(k==="text") e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]); } kids.flat().forEach(c=>c!=null&&e.append(c)); return e; }
function richText(s){ const span=document.createElement("span"); span.className="txt"; s.split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(part=>{ if(/^`[^`]+`$/.test(part)) span.append(el("code",{text:part.slice(1,-1)})); else if(/^\*\*[^*]+\*\*$/.test(part)) span.append(el("strong",{text:part.slice(2,-2)})); else span.append(part); }); return span; }
const main = document.getElementById("main"), nav = document.getElementById("nav");
function verdictBar(it){

    flag.addEventListener("click", ()=> saveLine(lk, it, l, lineNotes[lk]?.note||"", !flagged));

function answerBox(text, inLine){ const d=el("div",{class:"answer"+(inLine?" in-line":"")}, el("b",{text:"Claude"})); d.append(richText(text)); return d; }
function initiativeCard(it){
  const n = it.data, v = verdicts[it.id]?.verdict || "";
  const card = el("section",{class:"card",id:it.id,"data-v":v});
  card.append(el("div",{class:"head"}, el("h3",{text:(n.status ? n.short+" · " : "")+n.title}), el("div",{class:"chips"}, n.status ? el("span",{class:"chip",text:n.status}) : null, n.priority!=null && n.status==="proposed" ? el("span",{class:"chip",text:"priority "+n.priority}) : null)));
  if(n.key) card.append(el("div",{class:"meta",text:n.key+" · "+n.file}));
  card.append(el("p",{class:"summary"}, richText(n.summary)));
  if(n.body) card.append(el("details",{}, el("summary",{text:"What it covers"}), el("p",{}, richText(n.body))));
  const {bar} = verdictBar(it); card.append(bar); card.append(noteBox(it));
  syncBar(card, v); return card;
}
function decisionCard(it){
  const d = it.data, v = verdicts[it.id]?.verdict || "";
  const card = el("section",{class:"card decision",id:it.id,"data-v":v});
  card.append(el("div",{class:"head"}, el("h3",{text:d.title}), el("span",{class:"chip",text:"proposed"})));
  card.append(el("div",{class:"meta",text:d.key+" · "+d.file}));
  card.append(el("p",{class:"summary"}, richText(d.summary)));
  if(d.decision && d.decision!==d.summary){ const det=el("details",{}, el("summary",{text:"Decision section"}), el("p",{}, richText(d.decision))); card.append(det); }
  const {bar} = verdictBar(it); card.append(bar); card.append(noteBox(it));
  syncBar(card, v);
  return card;
}
function syncBar(card, v){ card.querySelectorAll(".verdict button").forEach(b=>{ b.setAttribute("aria-pressed", String(b.dataset.v===v)); b.disabled = !db; }); const s=card.querySelector(".saved"); const at=verdicts[card.id]?.at; if(s) s.textContent = at ? "saved "+new Date(at).toLocaleString() : ""; }
function tally(){
  const c={approve:0,change:0,reject:0}; items.forEach(i=>{ const v=verdicts[i.id]?.verdict; if(v) c[v]++; });
  document.getElementById("t-approve").textContent=c.approve; document.getElementById("t-change").textContent=c.change; document.getElementById("t-reject").textContent=c.reject;
  document.getElementById("t-pending").textContent = items.length - c.approve - c.change - c.reject;
}
async function setVerdict(it, v){
  if(!db) return;
  const prev = verdicts[it.id] || {}; const body = {item: it.type==="proposal" ? it.data.key : it.data.key, type: it.type, verdict: v, note: prev.note||"", at: Date.now()};
  verdicts[it.id] = body; render(); document.getElementById(it.id)?.scrollIntoView({block:"nearest"});
  try{ await db.collection("verdicts").doc(it.id).set(body); }catch(e){ note("Could not save: "+(e.message||e.code)+". Try again."); }
}
async function saveNote(it, text){
  if(!db) return;
  const prev = verdicts[it.id] || {item: it.data.key, type: it.type, verdict: null};
  const body = {...prev, note:text, at:Date.now()}; verdicts[it.id]=body;
  try{ await db.collection("verdicts").doc(it.id).set(body); const c=document.getElementById(it.id); if(c) syncBar(c, body.verdict||""); }catch(e){ note("Could not save the note: "+(e.message||e.code)); }
}
async function saveLine(lk, it, l, text, on){
  if(!db) return;
  try{
    if(on){ const body={item: it.data.key, capability: it.data.capability, line: "r"+l.n, note:text, at:Date.now()}; lineNotes[lk]=body; await db.collection("lineNotes").doc(lk).set(body); }
    else { delete lineNotes[lk]; await db.collection("lineNotes").doc(lk).delete(); }
    if(!on || !document.getElementById("ln-"+lk)) render();
  }catch(e){ note("Could not save the question: "+(e.message||e.code)); }
}
function note(msg){ document.getElementById("store-note").textContent = msg; }
document.getElementById("f-rw").addEventListener("change", render);
document.getElementById("f-open").addEventListener("change", render);
render();
if(window.claude?.use){
  claude.use("db").then(handle=>{
    if(!handle){ note("Verdicts can't be saved in this view. Open the page signed in to claude.ai to record them."); return; }
    db = handle; note("Verdicts save as you choose them; Claude reads them from here.");
    let firstV=true, firstL=true;
    db.collection("verdicts").onSnapshot(s=>{ s.docs.forEach(d=>{ verdicts[d.id]=d.data(); }); if(firstV || !document.activeElement || document.activeElement.tagName!=="TEXTAREA") render(); firstV=false; }, e=>note("The review store stopped answering: "+(e.message||e.code)));
    db.collection("lineNotes").onSnapshot(s=>{ Object.keys(lineNotes).forEach(k=>delete lineNotes[k]); s.docs.forEach(d=>{ lineNotes[d.id]=d.data(); }); if(firstL || document.activeElement?.tagName!=="TEXTAREA") render(); firstL=false; });
  });
} else { note("Verdicts can't be saved in this view. Open the page on claude.ai to record them."); }
})();
</script>

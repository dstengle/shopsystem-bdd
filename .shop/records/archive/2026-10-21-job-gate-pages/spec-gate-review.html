<title>Spec Gate Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Literata:opsz,wght@7..72,600&display=swap">
<style>
/* Layout: a gate ledger — sticky summary and index on the left, one card per proposal or decision on the right; lines read like the spec file they come from. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b2330; --muted:#5c6778; --rule:#dde2ea;
  --accent:#2f5bd3; --accent-soft:#e7edfc;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#9a6200; --warn-soft:#fbf0d9; --no:#b3322e; --no-soft:#f9e3e2;
  --was:#8a5a00; --was-bg:#fff7e6;
  --f-display:"Literata",Georgia,serif; --f-body:"Public Sans",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --ink:#e6eaf1; --muted:#9aa6b8; --rule:#2c3440;
  --accent:#8eaaff; --accent-soft:#232e4a; --ok:#6fd3a0; --ok-soft:#173326; --warn:#f0c062; --warn-soft:#3a2e14; --no:#ff8f88; --no-soft:#3d1f1e;
  --was:#f0c062; --was-bg:#2c2513; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --ink:#e6eaf1; --muted:#9aa6b8; --rule:#2c3440;
  --accent:#8eaaff; --accent-soft:#232e4a; --ok:#6fd3a0; --ok-soft:#173326; --warn:#f0c062; --warn-soft:#3a2e14; --no:#ff8f88; --no-soft:#3d1f1e;
  --was:#f0c062; --was-bg:#2c2513; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)} aside{position:static!important}}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:16px}
h1{font:600 1.55rem/1.2 var(--f-display);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem}
.tally{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tally div{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.tally b{display:block;font:600 1.25rem var(--f-mono);font-variant-numeric:tabular-nums}
.tally span{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px;font-size:.88rem;max-height:52vh;overflow:auto}
nav a{color:var(--ink);text-decoration:none;display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:6px}
nav a:hover,nav a:focus-visible{background:var(--accent-soft);outline:none}
nav .grp{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 8px 2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px;background:var(--rule)}
.dot.approve{background:var(--ok)} .dot.change{background:var(--warn)} .dot.reject{background:var(--no)}
.filters{display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.filters label{display:flex;gap:8px;align-items:center}
.notice{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
main{display:flex;flex-direction:column;gap:22px;min-width:0}
.section-h{font:600 1.15rem var(--f-display);margin:12px 0 0;border-bottom:1px solid var(--rule);padding-bottom:6px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:16px}
.card[data-v="approve"]{border-left:4px solid var(--ok)} .card[data-v="change"]{border-left:4px solid var(--warn)} .card[data-v="reject"]{border-left:4px solid var(--no)}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.head h3{margin:0;font:600 1.05rem var(--f-body)}
.meta{font:.78rem var(--f-mono);color:var(--muted);word-break:break-all}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 .7rem var(--f-mono);padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.rw{background:var(--was-bg);color:var(--was)}
.verdict{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.verdict button{font:600 .85rem var(--f-body);padding:6px 12px;border-radius:7px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);cursor:pointer}
.verdict button:focus-visible,.flag:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.verdict button[aria-pressed="true"][data-v="approve"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.verdict button[aria-pressed="true"][data-v="change"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.verdict button[aria-pressed="true"][data-v="reject"]{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.verdict button:disabled{opacity:.5;cursor:not-allowed}
.saved{font-size:.78rem;color:var(--muted)}
textarea{width:100%;box-sizing:border-box;min-height:2.4em;font:inherit;font-size:.9rem;padding:8px 10px;border-radius:7px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);resize:vertical}
ol.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--rule)}
ol.lines li{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--rule)}
.rid{font:600 .8rem var(--f-mono);color:var(--accent);padding-top:2px}
.txt{min-width:0;overflow-wrap:anywhere}
.txt code{font:.85em var(--f-mono)}
.was{grid-column:2/3;font-size:.86rem;background:var(--was-bg);color:var(--was);border-radius:6px;padding:6px 9px}
.was b{font:600 .7rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;margin-right:6px}
.flag{font:600 .72rem var(--f-body);border:1px solid var(--rule);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;cursor:pointer;align-self:start}
.flag[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.lnote{grid-column:2/4}
.decision p,.card>p{margin:0;max-width:72ch}
.card details p,.card p.summary{white-space:pre-line}
.answer{white-space:pre-line;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;padding:8px 11px;font-size:.9rem}
.answer b{font:600 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.answer.in-line{grid-column:2/4}
.summary{font-weight:600}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>

an and the end of its output.\n[r26] **If** no map has been made, `tools untested` refuses and says to make one with `tools map`.\n[r29] **If** the file `tools tests-of` is given does not exist, `tools` refuses, naming it.\n[r32] **If** git cannot compare the working tree with `--base`, `tools check` refuses with git's error.", "kind": "add", "answer": "r2: dropped: general line r49 \u2014 \"not a Python project\" wording in Implementation; r12: dropped: general line r49; r15: dropped: general line r49; r21: dropped: general line r49; r24: dropped: general line r49; r26: dropped: general line r49; r29: dropped: general line r49; r32: dropped: general line r49"}]}, {"answer": "**38 lines \u2192 23.**\n**Open choices:**\n1. r8 (no dispatch inside the batch) kept as an `If` line, joined to r6: a facts file of zeros would be a guessed\n   number (0018). Choice: as written; say if it is a minor refusal for r38.", "key": "capability/batch-measurement", "initiative": "ears", "release": "i13", "capability": "batch-measurement", "file": "spec/capabilities/batch-measurement.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** `measure batch <archive file>` is run, `measure` shall write one facts file for the batch running from the commit that added the archive file before it to the commit that added its own.", "prev": "[r1] **When** `measure batch <archive file>` is run, `measure` writes one facts file for the batch running from the commit that added the archive file before it to the commit that added its own.\n[r30] **When** `measure batch` has written the facts, it prints one line naming the file, the number of dispatches and slices, and the window.", "kind": "reworded", "answer": "r1: r1 \u2014 its one-line report (r30) in Implementation; r30: retired \u2192 r1"}, {"n": 2, "text": "**When** `measure batch` is run with no archive file, `measure batch` shall measure the open batch, named `--name` (default `open`), from the last commit that added a file under `--archive-dir` (default `docs/superpowers/plans/archive`) to now, reading the living plan.", "prev": "[r2] **Where** no archive file is given, `measure batch` measures the open batch, from the last archive commit to now, reading the living plan.\n[r25] **Where** no archive file is given, `measure batch` names the batch `--name`, default `open`, and without `--out` writes the facts to `docs/superpowers/measurements/<name>.json`.\n[r26] **Where** no archive file is given, the open batch starts at the last commit that added a file under `--archive-dir`, default `docs/superpowers/plans/archive`.", "kind": "reworded", "answer": "r2: r2 \u2014 takes r26 (the open batch's start) and r25's name; Where \u2192 When, as round 1; r25: retired \u2192 r2, r4; r26: retired \u2192 r2"}, {"n": 3, "text": "**Where** `--from` or `--to` is given, as a commit or an ISO time, `measure batch` shall use it in place of that end of the batch.", "prev": "[r3] **Where** `--from` or `--to` is given, as a commit or an ISO time, `measure batch` uses it in place of that end of the batch.", "kind": "reworded", "answer": "r3: r3 \u2014 unchanged meaning"}, {"n": 4, "text": "**Where** no `--out` is given, `measure batch` shall write the facts to `docs/superpowers/measurements/<name>.json`, the name being the archive file's without `.md`, or the open batch's.", "prev": "[r4] **Where** no `--out` is given, `measure batch` writes the facts to `docs/superpowers/measurements/<archive file's name without .md>.json`.\n[r25] **Where** no archive file is given, `measure batch` names the batch `--name`, default `open`, and without `--out` writes the facts to `docs/superpowers/measurements/<name>.json`.", "kind": "reworded", "answer": "r4: r4 \u2014 takes r25's path for the open batch; r25: retired \u2192 r2, r4"}, {"n": 6, "text": "**If** a transcript's shape is not known, or no dispatch is found inside the batch, then `measure batch` shall refuse, naming the file and what was missing, or the window it searched, and write no facts file.", "prev": "[r6] **If** a transcript's shape is not known, `measure batch` refuses, naming the file and what was missing, and writes no facts file.\n[r8] **If** no dispatch is found inside the batch, `measure batch` refuses, naming the window it searched, and writes nothing.", "kind": "reworded", "answer": "r6: r6 \u2014 takes r8 (no dispatch inside the batch); r8: retired \u2192 r6"}, {"n": 7, "text": "**If** the facts file exists and `--replace` is not given, then `measure batch` shall refuse, leaving the file as it was.", "prev": "[r7] **If** the facts file exists and `--replace` is not given, `measure batch` refuses and leaves the file as it was.", "kind": "reworded", "answer": "r7: r7 \u2014 unchanged meaning"}, {"n": 9, "text": "`measure batch` shall count a subagent transcript as a dispatch when it starts inside the batch, and not when it starts outside it.", "prev": "[r9] A subagent transcript that starts inside the batch is counted as a dispatch, and one that starts outside it is not.", "kind": "reworded", "answer": "r9: r9 \u2014 unchanged meaning, as what `measure batch` counts"}, {"n": 10, "text": "`measure batch` shall count a request's usage once, however many transcript rows it appears in, reporting its reasoning tokens as \"of which\" its output tokens and never adding them to that figure.", "prev": "[r10] A request's usage is counted once in the facts, however many transcript rows it appears in, and its reasoning tokens are a part of its output tokens: the facts report reasoning as \"of which\" the output figure and never add it to that figure.", "kind": "reworded", "answer": "r10: r10 \u2014 unchanged meaning"}, {"n": 11, "text": "**When** a session dispatched inside the batch, `measure batch` shall count that session's own requests inside the batch as the controller's.", "prev": "[r11] The facts count a session's own requests inside the batch as the controller's when that session dispatched there.", "kind": "reworded", "answer": "r11: r11 \u2014 unchanged meaning"}, {"n": 12, "text": "`measure batch` shall attribute a dispatch to a slice or batch work by its description, failing that by the task or slice its prompt names, and otherwise count it as unattributed.", "prev": "[r12] The facts attribute a dispatch to a slice or batch work by its description, failing that by the task or slice its prompt names, and otherwise count it as unattributed.", "kind": "reworded", "answer": "r12: r12 \u2014 unchanged meaning"}, {"n": 13, "text": "`measure batch` shall count a reviewer's findings as it wrote them: its lines beginning Critical or Important, and its stated count of Minor.", "prev": "[r13] The facts count a reviewer's findings as it wrote them: its lines beginning Critical or Important, and its stated count of Minor.", "kind": "reworded", "answer": "r13: r13 \u2014 unchanged meaning"}, {"n": 14, "text": "`measure batch` shall give each commit to the implementer running when it was made, counting as ambiguous a commit made while more than one ran, and count the files it touched as production, test or other.", "prev": "[r14] The facts give each commit to the implementer running when it was made, and count the files it touched as production, test or other.\n[r28] The facts count, as ambiguous, the commits made while more than one implementer was running.", "kind": "reworded", "answer": "r14: r14 \u2014 takes r28 (ambiguous commits); r28: retired \u2192 r14"}, {"n": 15, "text": "`measure batch` shall give each slice it holds (the archive file's and every other slice a dispatch is attributed to, or for the open batch only those) its Lands line from the archive file or the living plan, with the numbers of production and test files it says it will land, beside the numbers of production, test and other files its dispatches touched.", "prev": "[r15] The facts give each slice its Lands line from the archive file, or the living plan for the open batch, the numbers of production and test files it says it will land, beside the numbers of production, test and other files its dispatches touched.\n[r27] The facts hold the archive file's slices and every other slice a dispatch is attributed to, and for the open batch only the slices a dispatch is attributed to.", "kind": "reworded", "answer": "r15: r15 \u2014 takes r27 (which slices the facts hold); r27: retired \u2192 r15"}, {"n": 16, "text": "`measure batch` shall give the tasks the batch plan had when it was added and the tasks it had at the batch's end, the plan's hand-back entries and its suite record.", "prev": "[r16] The facts give the tasks the batch plan had when it was added and the tasks it had at the batch's end, the plan's hand-back entries and its suite record.", "kind": "reworded", "answer": "r16: r16 \u2014 unchanged meaning"}, {"n": 17, "text": "`measure batch` shall write no prompt, reply or tool content into the facts.", "prev": "[r17] The facts hold no prompt, reply or tool content.", "kind": "reworded", "answer": "r17: r17 \u2014 unchanged meaning"}, {"n": 18, "text": "**When** `measure show <file>` is run, `measure` shall print the facts file as tables.", "prev": "[r18] **When** `measure show <file>` is run, `measure` prints the facts file as tables.\n[r35] **When** `measure show` is run, `measure` prints the repository, batch, window, plugin and harness versions and suite record, then the summary, roles and slices tables, the dispatches not done or not attributed, each hand-back and each note.", "kind": "reworded", "answer": "r18: r18 \u2014 what `show` prints (r35) in Implementation; r35: retired \u2192 r18"}, {"n": 19, "text": "**When** `measure compare <a> <b>` is run, `measure` shall print the two facts files' figures side by side, in total and per slice, with the ratio of the second to the first.", "prev": "[r19] **When** `measure compare <a> <b>` is run, `measure` prints the two facts files side by side.\n[r36] **When** `measure compare` is run, `measure` prints each summary figure and the output, new input, cache read and agent minutes per slice (each summary figure divided by the file's slices) of both files, each file headed by its batch and plugin versions, with the ratio of the second to the first.", "kind": "reworded", "answer": "r19: r19 \u2014 takes r36's per-slice figures and ratio; the rest of r36 in Implementation; r36: retired \u2192 r19"}, {"n": 29, "text": "**If** no dispatch names a ledger and no `--tasks` is given, or the batch plan is in no commit, then `measure batch` shall leave tasks uncounted, with a note in the facts saying why.", "prev": "[r29] **If** no dispatch names a ledger and no `--tasks` is given, or the batch plan is in no commit, the facts leave tasks uncounted and hold a note saying why, and `measure batch` writes the note on stderr.", "kind": "reworded", "answer": "r29: r29 \u2014 the note on stderr in Implementation"}, {"n": 31, "text": "`measure batch` shall give each dispatch the closing status its reply states, counting replies that close BLOCKED, PARTIAL or NEEDS_CONTEXT as not done.", "prev": "[r31] The facts give each dispatch the closing status its reply states, and count replies that close BLOCKED, PARTIAL or NEEDS_CONTEXT as not done.", "kind": "reworded", "answer": "r31: r31 \u2014 unchanged meaning"}, {"n": 32, "text": "`measure batch` shall record the plugin and harness versions the transcripts name, and the batch's window as times and, where known, commits.", "prev": "[r32] The facts record the plugin and harness versions the transcripts name, and the batch's window as times and, where known, commits.", "kind": "reworded", "answer": "r32: r32 \u2014 unchanged meaning"}, {"n": 33, "text": "**Where** the batch starts at a commit, `measure batch` shall give the files and lines changed from it to the batch's end commit, or to HEAD when the end is not a commit.", "prev": "[r33] **Where** the batch starts at a commit, the facts give the files and lines changed from it to the batch's end commit, or to HEAD when the end is not a commit.", "kind": "reworded", "answer": "r33: r33 \u2014 unchanged meaning"}, {"n": 34, "text": "`measure batch` shall count the dispatches given more than one prompt as resumed; give the share of building time from the first branch review on, building time being the dispatches' own durations summed, not wall-clock time, with a scout's dispatches left out of both; and give the mean and summed starting context of the dispatches.", "prev": "[r34] The facts count the dispatches given more than one prompt as resumed; they give the share of building time from the first branch review on, where building time is the dispatches' own durations summed and not wall-clock time, and a scout's dispatches are left out of both that time and the part of it from the first branch review on; and they give the mean and summed starting context of the dispatches.", "kind": "reworded", "answer": "r34: r34 \u2014 unchanged meaning"}, {"n": 38, "text": "**If** `measure` cannot do what it was asked, then `measure` shall exit non-zero, say why on stderr, and change nothing.", "prev": "[r5] **If** the archive file was not added by any commit, `measure batch` refuses, naming the file.\n[r20] **If** `measure show` is given a file that is not a facts file `measure` wrote, `measure` refuses, naming the file.\n[r21] **If** no archive file is given, no `--plan` is given and the repository holds no `docs/superpowers/plans/*-slices.md` or several, `measure batch` refuses, saying to name the living plan with `--plan`.\n[r22] **If** no archive file was added before the batch's end and no `--from` is given, `measure batch` refuses, saying to give the batch's start with `--from`.\n[r23] **If** `--from` or `--to` is neither a commit nor an ISO time, `measure batch` refuses, naming what it was given.\n[r24] **If** `--repo`, default the current directory, is not inside a git repository, or a git command `measure batch` runs fails, `measure` refuses with git's error.\n[r37] **If** `measure compare` is given a file that is not a facts file `measure` wrote, or `measure show` or `measure compare` a file it cannot read as JSON, `measure` refuses, naming the file.\n[r38] **If** `measure` refuses, it says why on stderr and exits 1.", "kind": "reworded", "answer": "r5: dropped: general line r38; r20: dropped: general line r38; r21: dropped: general line r38 \u2014 its hint (`--plan`) in Implementation; r22: dropped: general line r38 \u2014 its hint (`--from`) in Implementation; r23: dropped: general line r38; r24: dropped: general line r38; r37: dropped: general line r38; r38: r38 \u2014 now the general line (\"exit non-zero, say why on stderr, change nothing\")"}]}, {"answer": "**11 lines \u2192 10.**\n**Open choices:**\nNone open.", "key": "capability/code-research", "initiative": "ears", "release": "i13", "capability": "code-research", "file": "spec/capabilities/code-research.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** research ends, the researcher shall leave its notes in the notes file and the file set in the result file its brief names, and the checkout unchanged.", "prev": "[r1] **When** research ends, its notes are in the notes file the brief names, its result file gives the file set, and the checkout is unchanged.", "kind": "reworded", "answer": "r1: r1 \u2014 one response, the state research leaves (r13, r14 unused)"}, {"n": 3, "text": "**When** a requirement the work-item accepts changes or replaces one that existing code relies on, the researcher shall list in the notes every place that still makes the old assumption, with the tests that execute it.", "prev": "[r3] **When** a requirement the work-item accepts changes or replaces one that existing code relies on, the notes list every place that still makes the old assumption, with the tests that execute it.", "kind": "reworded", "answer": "r3: r3 \u2014 \"changes or replaces\" one trigger again (r15 unused)"}, {"n": 4, "text": "**When** a work-item is researched, the researcher shall say in the notes why each scenario it accepts is red today, from a run of it.", "prev": "[r4] **When** a work-item is researched, the notes say why each scenario it accepts is red today from a run of it, and each probe of today's behaviour with its command and what came back, marked `run`; what was concluded from reading is marked `read`.", "kind": "reworded", "answer": "r4: r4 \u2014 why each scenario is red, from a run; the `run`/`read` marking of probes and conclusions moved to Implementation as the notes' form (r16, r17 unused)"}, {"n": 5, "text": "**When** a work-item is researched, the researcher shall list in the notes the existing tests its accepted requirements make impossible to keep, starting from the tests that execute the code those requirements change.", "prev": "[r5] **When** a work-item is researched, the notes list the existing tests its accepted requirements make impossible to keep, starting from the tests that execute the code those requirements change.", "kind": "reworded", "answer": "r5: r5 \u2014 unchanged meaning"}, {"n": 6, "text": "**When** a work-item adds a path that skips a stage, the researcher shall list in the notes every refusal and effect only that stage produces.", "prev": "[r6] **When** a work-item adds a path that skips a stage, the notes list every refusal and effect only that stage produces.", "kind": "reworded", "answer": "r6: r6 \u2014 unchanged meaning"}, {"n": 8, "text": "**When** a probe finds a defect in today's behaviour, the researcher shall report it in the notes with its reproduction.", "prev": "[r8] **When** a probe finds a defect in today's behaviour, the notes report it with its reproduction.", "kind": "reworded", "answer": "r8: r8 \u2014 unchanged meaning"}, {"n": 9, "text": "The researcher shall run every probe in a scratch directory, on none of the checkout's data.", "prev": "[r9] Probes run in a scratch directory, never on the checkout's data.", "kind": "reworded", "answer": "r9: r9 \u2014 one line (r18 unused); protects the checkout's data"}, {"n": 10, "text": "The researcher shall name in the result's file set every production and test file the work-item must change for its scenarios to pass and for everything that passes today to keep passing, each one a search or a read showed.", "prev": "[r10] The result's file set names every production and test file the work-item must change for its scenarios to pass and for everything that passes today to keep passing, each one a search or a read showed.", "kind": "reworded", "answer": "r10: r10 \u2014 unchanged meaning"}, {"n": 11, "text": "The researcher shall give in the notes each module on the change's path with its line count and its room under the size limit `CLAUDE.md` states.", "prev": "[r11] The notes give each module on the change's path its line count and its room under the size limit `CLAUDE.md` states.", "kind": "reworded", "answer": "r11: r11 \u2014 unchanged meaning"}, {"n": 12, "text": "**If** the researcher cannot do what its brief asks, then the researcher shall stop with the result `NEEDS_CONTEXT`, saying why, and change nothing.", "prev": "[r12] The result's status is `DONE` or `NEEDS_CONTEXT`, and its summary is under fifteen lines.", "kind": "reworded", "answer": "r12: r12 \u2014 now the general line for the researcher; the status set and the summary length moved to Implementation (r19 unused)"}]}, {"answer": "**Walking skeleton: 7 lines.** The cut round-1 lines are ideas to test, in the initiative's notes.", "key": "capability/delivery", "initiative": "ears", "release": "i13", "capability": "delivery", "file": "spec/capabilities/delivery.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** the person asks to deliver an initiative, `delivering-an-initiative` shall draft with `work add` work-items that between them accept each requirement the initiative's `formulated` capability-proposals add or change.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 2, "text": "`delivering-an-initiative` shall draft from `spec/`, `features/` and `.shop/work/` alone, reading no code.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 3, "text": "**When** the work-items are drafted, `delivering-an-initiative` shall commit them alone.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 4, "text": "**When** the drafted work-items are committed, `delivering-an-initiative` shall start `work run` on the initiative.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 5, "text": "**While** `work run` runs, `delivering-an-initiative` shall read nothing its workers write.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 6, "text": "**When** `work run` exits, `delivering-an-initiative` shall show the person each work-item's status and each open question, as `work run` printed them.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}, {"n": 7, "text": "**If** `delivering-an-initiative` cannot do what it was asked, then `delivering-an-initiative` shall stop, saying why, and change nothing.", "prev": null, "kind": "add", "answer": "Walking skeleton line (a capability not yet built)."}]}, {"answer": "**65 lines \u2192 50.**\n**Open choices:**\n1. The reports table: rows carry ids and count as lines (0051), introduced by one un-numbered sentence, and\n   Behaviour has `###` sub-headings. Does `model check` (v15a, v_e1, v_e2) read table rows and skip the\n   sentence and headings? Choice: drafted so; the check must learn the table before this file is published.\n2. \"Withdrawn as a status\" (r58's first half) and r39's exit 2 moved to Implementation. Choice: kept, as lifecycle\n   detail and a minor refusal.", "key": "capability/design-model-check", "initiative": "ears", "release": "i13", "capability": "design-model-check", "file": "spec/capabilities/design-model-check.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** `model check` finds no violation, unresolved reference or file problem, `model check` shall say so and exit 0.", "prev": "[r1] **When** `model check` finds no violation, unresolved reference or file problem, it says so with the counts and exits 0.", "kind": "reworded", "answer": "r1: r1 \u2014 \"with the counts\" moved to Implementation"}, {"n": 2, "text": "**If** `model check` finds a violation, an unresolved reference or a file problem, then `model check` shall print each, a violated relation by its grammar.md code and plain label with its rows, and exit 1.", "prev": "[r2] **When** `model check` finds violations, it prints each violated relation by its grammar.md name and its plain label, with its rows, and exits 1.\n[r30] **If** `model check` finds a file problem, it prints each and exits 1.\n[r31] **When** `model check` ends without `--json`, it prints the counts of violations, warnings, unresolved references and file problems.\n[r32] **Where** `--limit <n>` is given, default 10, `model check` prints at most n rows of each violated relation and how many more there are.", "kind": "reworded", "answer": "r2: r2 \u2014 now any violation, unresolved reference or file problem: print each, exit 1; r30: retired \u2192 r2; r31: retired \u2192 r2 \u2014 the counts summary moved to Implementation; r32: retired \u2192 r2 \u2014 `--limit` moved to Implementation (an output format)"}, {"n": 3, "text": "Table row: v15a \u2014 a requirement bullet in a capability's Behaviour has no `[r<n>]`", "prev": "[r3] **If** a requirement bullet in a capability's Behaviour has no `[r<n>]`, `model check` reports it under v15a, a requirement has no id.", "kind": "reworded", "answer": "r3: r3 \u2014 table row, v15a"}, {"n": 4, "text": "Table row: v15b \u2014 two requirements of one capability have the same id", "prev": "[r4] **If** two requirements of one capability have the same id, `model check` reports them under v15b, two requirements share an id.", "kind": "reworded", "answer": "r4: r4 \u2014 table row, v15b"}, {"n": 5, "text": "Table row: v15c \u2014 a capability uses an id it lists as retired, or a capability-proposal that is not `merged`, `formulated` or `withdrawn` adds one", "prev": "[r5] **If** a capability uses an id it lists as retired, `model check` reports it under v15c, a retired id is used again.", "kind": "reworded", "answer": "r5: r5 \u2014 table row, v15c; takes r23's \"adding a retired id is v15c\""}, {"n": 6, "text": "Table row: v15e \u2014 a `drafted` or `approved` capability-proposal changes a requirement no capability has", "prev": "[r6] **If** a capability-proposal that is `drafted` or `approved` changes a requirement no capability has, `model check` reports it under v15e, a proposal changes a requirement no capability has.", "kind": "reworded", "answer": "r6: r6 \u2014 table row, v15e"}, {"n": 7, "text": "Table row: v15f \u2014 a `formulated` capability-proposal adds or changes a requirement with no scenario, of a capability that is not guarantees", "prev": "[r7] **If** a capability-proposal is `formulated` while a requirement it adds or changes has no scenario, and the capability is not guarantees, `model check` reports it under v15f, a formulated proposal leaves a requirement without a scenario.", "kind": "reworded", "answer": "r7: r7 \u2014 table row, v15f"}, {"n": 8, "text": "Table row: v_s3 \u2014 a requirement of a capability that is not guarantees has no scenario naming it", "prev": "[r8] **If** a requirement of a capability that is not guarantees has no scenario naming it, `model check` reports it under v_s3, a requirement has no scenario.", "kind": "reworded", "answer": "r8: r8 \u2014 table row, v_s3"}, {"n": 9, "text": "Table row: unresolved \u2014 a scenario names a requirement its capability does not have, or a capability rests on a decision that does not exist", "prev": "[r9] **If** a scenario names a requirement its capability does not have, or a capability rests on a decision that does not exist, `model check` reports the unresolved reference and exits 1.", "kind": "reworded", "answer": "r9: r9 \u2014 table row, unresolved; its \"exits 1\" is r2"}, {"n": 10, "text": "Table row: v9a, v9c \u2014 a part has no `part_of` (v9a), or its `part_of` chain reaches no initiative (v9c)", "prev": "[r10] **If** a part has no `part_of`, or its `part_of` chain does not reach an initiative, `model check` reports it under v9a, a part has no part_of, or v9c, a part reaches no initiative.", "kind": "reworded", "answer": "r10: r10 \u2014 table row, v9a and v9c"}, {"n": 11, "text": "**When** `model check` finds warnings, `model check` shall print each warning relation with its plain label and its count, leaving the exit status as the other findings set it.", "prev": "[r11] **When** `model check` finds warnings, it prints each warning relation with its plain label and its count, and they alone do not change the exit status.", "kind": "reworded", "answer": "r11: r11 \u2014 unchanged meaning"}, {"n": 12, "text": "**If** no interpreter has clingo, then `model check` shall exit 2, naming each interpreter it tried and the command that installs clingo.", "prev": "[r12] **If** the clingo package is missing, `model check` says so with the command that installs it and exits 2.\n[r57] **If** no interpreter has clingo, `model check` exits 2 with its message naming each interpreter it tried.", "kind": "reworded", "answer": "r12: r12 \u2014 now the case no interpreter has clingo (takes r57); exit 2 naming each tried and the install command; r57: retired \u2192 r12"}, {"n": 13, "text": "**When** `model facts` is run, `model facts` shall print the facts read, one a line in clingo's syntax, using only the standard library.", "prev": "[r13] **When** `model facts` is run, it prints the facts read, one a line in clingo's syntax, using only the standard library.", "kind": "reworded", "answer": "r13: r13 \u2014 unchanged meaning"}, {"n": 14, "text": "**When** `model decisions` is run, `model decisions` shall write `spec/decisions/index.md` listing every decision in `spec/decisions/` that has an `id`, with its summary, status, what it supersedes and when to revisit it, each linked to its file.", "prev": "[r14] **When** `model decisions` is run, `spec/decisions/index.md` lists every decision in `spec/decisions/` with its summary, status, what it supersedes and when to revisit it, each linked to its file.\n[r38] **When** `model decisions` is run, it prints the file it wrote, and a decision file with no `id` is left out of the index.", "kind": "reworded", "answer": "r14: r14 \u2014 takes r38's \"a decision with no id is left out\"; r38: retired \u2192 r14 \u2014 \"prints the file it wrote\" moved to Implementation"}, {"n": 15, "text": "**If** `model decisions --check` finds `spec/decisions/index.md` is not what `model decisions` would write, then `model decisions` shall say so and exit 1, writing nothing.", "prev": "[r15] **When** `model decisions --check` is run and `spec/decisions/index.md` is not what `model decisions` would write, it says so, exits 1 and writes nothing.", "kind": "reworded", "answer": "r15: r15 \u2014 unchanged meaning"}, {"n": 16, "text": "**When** `model why <capability>#r<n>` is run, `model why` shall print the requirement's text (or that no capability has it), each capability-proposal that adds, changes or removes it in date order with its status and date, the `part_of` chain to its initiative and the initiative's sources.", "prev": "[r16] **When** `model why <capability>#r<n>` is run, it prints the requirement, each capability-proposal that adds or changes it, the `part_of` chain to its initiative and the initiative's sources.\n[r40] **If** no capability has the requirement `model why` names, it says so in place of the requirement's text and still lists the proposals that name it.\n[r41] **When** `model why` is run, it lists each capability-proposal that adds, changes or removes the requirement, in date order with its status and date. **If** no capability-proposal adds or changes it, including when every one that names it only removes it, `model why` exits 1; one proposal that adds or changes it is enough for exit 0.", "kind": "reworded", "answer": "r16: r16 \u2014 takes r41's listing (adds, changes or removes, date order, status and date) and r40's \"says no capability has it\"; r40: retired \u2192 r16; r41: retired \u2192 r16, r17"}, {"n": 17, "text": "**If** no capability-proposal adds or changes the requirement, then `model why` shall say so and exit 1.", "prev": "[r17] **If** no capability-proposal adds or changes the requirement, `model why` says so and exits 1.\n[r41] **When** `model why` is run, it lists each capability-proposal that adds, changes or removes the requirement, in date order with its status and date. **If** no capability-proposal adds or changes it, including when every one that names it only removes it, `model why` exits 1; one proposal that adds or changes it is enough for exit 0.", "kind": "reworded", "answer": "r17: r17 \u2014 takes r41's exit 1 when none adds or changes it; r41: retired \u2192 r16, r17"}, {"n": 18, "text": "`model` shall read `<capability>#r<a>-r<b>` in a proposal's or work-item's list as every id from a to b.", "prev": "[r18] **Where** a proposal's or work-item's list names `<capability>#r<a>-r<b>`, `model` reads it as every id from a to b.", "kind": "reworded", "answer": "r18: r18 \u2014 unchanged meaning"}, {"n": 19, "text": "`model` shall read, under `--root` (default the current directory), only `spec/index.md`, `spec/capabilities/*.md`, every `*.feature` under `features/`, every `spec/decisions/*.md` but `index.md`, `.shop/work/<initiative>/*.md`, `.shop/records/observations.md` and any other Markdown under `.shop/records/` whose frontmatter has an `id`.", "prev": "[r19] `model` reads, under `--root` (default the current directory), `spec/index.md`, `spec/capabilities/*.md`, every `*.feature` under `features/`, every `spec/decisions/*.md` but `index.md`, `.shop/work/<initiative>/*.md`, `.shop/records/observations.md` and any other Markdown under `.shop/records/` whose frontmatter has an `id`, and nothing else.", "kind": "reworded", "answer": "r19: r19 \u2014 unchanged meaning"}, {"n": 20, "text": "`model` shall read each `@r<n>` tag of a scenario not tagged `@deprecated` in `features/<capability name>.feature`, its own or its feature's, as a requirement of that capability the scenario names.", "prev": "[r20] A scenario names a requirement by a tag `@r<n>`, its own or its feature's, in `features/<capability name>.feature`.\n[r44] A scenario tagged `@deprecated` is not read as an acceptance-scenario, whatever `@r<n>` tag it has.", "kind": "reworded", "answer": "r20: r20 \u2014 0052's rule (each `@r<n>` tag a requirement); takes r44 (`@deprecated` not read); r44: retired \u2192 r20"}, {"n": 21, "text": "`model` shall read a reference written `<name>#r<n>` or `capability/<name>#r<n>` as a requirement of the capability `capability/<context path>/<name>` in the bounded context, the field fixing the kind where it is written `<name>`.", "prev": "[r21] A reference written `<name>#r<n>` or `capability/<name>#r<n>` is read as a requirement of the capability `capability/<context path>/<name>` in the bounded context, the field fixing the kind where it is written `<name>`.", "kind": "reworded", "answer": "r21: r21 \u2014 unchanged meaning"}, {"n": 22, "text": "Table row: unresolved \u2014 a list names a reference that is not `<capability>#r<n>` (`#behaviour/r<n>` included), with the capability written `capability/<context path>/<name>`, `capability/<name>` or `<name>`, or a range `#r<a>-r<b>` with a greater than b", "prev": "[r22] **If** a list names a reference that is not `<capability>#r<n>`, with the capability written `capability/<context path>/<name>`, `capability/<name>` or `<name>`, or a range `#r<a>-r<b>` with a greater than b, `model check` reports it as unresolved.\n[r67] **If** a reference is written `<capability>#behaviour/r<n>`, `model check` reports it as unresolved, as it does any reference that is not a requirement's.", "kind": "reworded", "answer": "r22: r22 \u2014 table row, unresolved; takes r67 (`#behaviour/r<n>`); r67: retired \u2192 r22"}, {"n": 23, "text": "Table row: unresolved \u2014 a capability-proposal adds or removes an id its capability neither has nor lists as retired, or removes a retired id while not `merged`, `formulated` or `withdrawn`; a proposal that is may name a retired id in `adds`, `changes` or `removes`, one it removes read as that requirement", "prev": "[r23] **If** a capability-proposal adds or removes a requirement no capability has, `model check` reports it as unresolved, except that adding an id the capability lists as retired is reported under v15c, and that a proposal that is `merged`, `formulated` or `withdrawn` may name an id its capability lists as retired, in `adds`, `changes` or `removes`, without a report, an id it removes being read as that requirement.", "kind": "reworded", "answer": "r23: r23 \u2014 table row, unresolved; its v15c exception is in r5"}, {"n": 24, "text": "Table row: unresolved \u2014 a `supersedes`, `source`, `part_of`, `argues`, `under`, `for`, `blocked_by`, `depends_on`, `fixes` or `findings` names nothing in the repository, a node of the wrong kind (`supersedes` needs a design-decision, `under` and `depends_on` a capability, `for`, `blocked_by` and `fixes` a work-item, `findings` a review-finding); or any reference is written `<context name>/<name>`, `decision/<name>` or `obs/<name>`", "prev": "[r24] **If** a `supersedes`, `source`, `part_of`, `argues`, `under`, `for`, `blocked_by`, `depends_on`, `fixes` or `findings` names nothing in the repository, or names a node of the wrong kind (`supersedes` needs a design-decision, `under` and `depends_on` a capability, `for`, `blocked_by` and `fixes` a work-item, `findings` a review-finding), `model check` reports it as unresolved.\n[r47] **If** a reference is written `<context name>/<name>`, `decision/<name>` or `obs/<name>`, `model check` reports it as unresolved.", "kind": "reworded", "answer": "r24: r24 \u2014 table row, unresolved; takes r47 (refused forms); r47: retired \u2192 r24"}, {"n": 25, "text": "Table row: file problem \u2014 `spec/index.md` is missing or has no `id`; a capability's `id` is not `capability/<context path>/<file name>`, it has no `## Behaviour` section, its `retired` lists an entry that is neither `r<n>` nor a number, or its frontmatter has `formulated_as`", "prev": "[r25] **If** `spec/index.md` is missing or has no `id`, a capability's `id` is not `capability/<context path>/<file name>`, a capability has no `## Behaviour` section, or its `retired` lists an entry that is neither `r<n>` nor a number, `model check` reports a file problem naming the file.\n[r60] **If** a capability's frontmatter has `formulated_as`, `model check` reports a file problem naming the file.", "kind": "reworded", "answer": "r25: r25 \u2014 table row, file problem; takes r60 (`formulated_as`); r60: retired \u2192 r25"}, {"n": 26, "text": "Table row: file problem \u2014 a feature file is not `features/<name>.feature` for a capability `<name>`, two of its scenarios not tagged `@deprecated` share a title, or a scenario is tagged `@holding`", "prev": "[r26] **If** a feature file is not `features/<name>.feature` for a capability `<name>`, or two of its scenarios share a title, `model check` reports a file problem naming the file. A scenario tagged `@deprecated` is not counted in the title check.\n[r62] **If** a scenario is tagged `@holding`, `model check` reports a file problem naming the file and the scenario's title.", "kind": "reworded", "answer": "r26: r26 \u2014 table row, file problem; takes r62 (`@holding`); r62: retired \u2192 r26 \u2014 naming the title moved to Implementation"}, {"n": 27, "text": "Table row: file problem \u2014 a work directory has no `initiative.md` (the directory named, not the file), an initiative or part has no `id`, a part's kind is not a part kind, a status is missing or not in its kind's lifecycle, an initiative's priority is not a number or its date not `YYYY-MM-DD`, or a work-item accepts a requirement no scenario names yet", "prev": "[r27] **If** a work directory has no `initiative.md`, an initiative or part has no `id`, a part's kind is not a part kind, a status is missing or not in its kind's lifecycle, an initiative's priority is not a number or its date is not `YYYY-MM-DD`, `model check` reports a file problem naming the file; for a work directory with no `initiative.md` it names the directory, not the missing file.\n[r28] **If** a work-item accepts a requirement no scenario names yet, `model check` reports a file problem naming the work-item's file.", "kind": "reworded", "answer": "r27: r27 \u2014 table row, file problem; takes r28 (work-item accepting an unnamed requirement); r28: retired \u2192 r27"}, {"n": 29, "text": "Table row: file problem \u2014 a decision has no `id` or no `## Decision` section, a record with an `id` has a kind that is not a record kind, a frontmatter value is written as a folded or literal block, or one id names nodes of two kinds", "prev": "[r29] **If** a decision has no `id`, a record with an `id` has a kind that is not a record kind, a frontmatter value is written as a folded or literal block, or one id names nodes of two kinds, `model check` reports a file problem.\n[r63] **If** a decision file has no `## Decision` section, `model check` reports a file problem naming the file.", "kind": "reworded", "answer": "r29: r29 \u2014 table row, file problem; takes r63 (no `## Decision`); r63: retired \u2192 r29"}, {"n": 33, "text": "**Where** `--json` is given, `model check` shall print its violations, warnings, unresolved references and file problems as one JSON object, each code mapped to its plain label, with the same exit status.", "prev": "[r33] **Where** `--json` is given, `model check` prints the violations, warnings, unresolved references and file problems as one JSON object, with each code printed mapped to its plain label, and the same exit status.", "kind": "reworded", "answer": "r33: r33 \u2014 unchanged meaning"}, {"n": 34, "text": "Table row: v_k5 \u2014 an initiative that is not a capability-change has more than one part directly under it (a capability-change may have several capability-proposals)", "prev": "[r34] **If** an initiative that is not a capability-change has more than one part directly under it, `model check` reports it under v_k5, an initiative has more than one first part, while a capability-change initiative may have several capability-proposals.", "kind": "reworded", "answer": "r34: r34 \u2014 table row, v_k5"}, {"n": 35, "text": "Table row: v_k6 \u2014 a capability-proposal argues more than one capability", "prev": "[r35] **If** a capability-proposal argues more than one capability, `model check` reports it under v_k6, a capability-proposal argues more than one capability.", "kind": "reworded", "answer": "r35: r35 \u2014 table row, v_k6"}, {"n": 36, "text": "**When** `model check` decides whether an initiative may be done, `model check` shall count a `formulated` capability-proposal, and any `withdrawn` part, as closed.", "prev": "[r36] A capability-proposal at `formulated` counts as closed when `model check` decides whether an initiative may be done.\n[r58] A capability-proposal or a work-item may have the status `withdrawn`, and `model check` counts a withdrawn part as closed when it decides whether an initiative may be done.", "kind": "reworded", "answer": "r36: r36 \u2014 takes r58 (a `withdrawn` part closed); r58: retired \u2192 r36 \u2014 \"`withdrawn` is a status of proposal and work-item\" moved to Implementation"}, {"n": 37, "text": "**When** `model decisions --check` finds `spec/decisions/index.md` is what `model decisions` would write, `model decisions` shall say the file is current and exit 0.", "prev": "[r37] **When** `model decisions --check` finds `spec/decisions/index.md` is what `model decisions` would write, it says the file is current and exits 0.", "kind": "reworded", "answer": "r37: r37 \u2014 unchanged meaning"}, {"n": 43, "text": "`model` shall read a node written `<kind>/<context path>/<name>`, or `<kind>/<name>`, as that node, and a bare `<name>` as one only in a field that fixes the kind (`rests_on`, `supersedes`, `argues`, `under`, `depends_on`) or the capability part of a `#r<n>` reference, the context path being `<owner>/<product>/<context name>` and the bounded context `bounded-context/<context path>`.", "prev": "[r43] A node is written `<kind>/<context path>/<name>`, or in short `<kind>/<name>`, and a field that fixes the kind (`rests_on`, `supersedes`, `argues`, `under`, `depends_on`) and the capability part of a `#r<n>` reference may write the bare `<name>`; `part_of`, `for`, `blocked_by`, `fixes` and `findings` need `<kind>/<name>`; the context path is `<owner>/<product>/<context name>` and the bounded context is `bounded-context/<context path>`.", "kind": "reworded", "answer": "r43: r43 \u2014 one reading line; a bare name elsewhere is not read as a node, hence unresolved (r24)"}, {"n": 46, "text": "Table row: file problem \u2014 a node's `id` is not `<kind>/<context path>/<name>` with its own kind, or `spec/index.md`'s is not `bounded-context/<context path>`", "prev": "[r46] **If** a node's `id` is not `<kind>/<context path>/<name>` with its own kind, or spec/index.md's `id` is not `bounded-context/<context path>`, `model check` reports a file problem naming the file.", "kind": "reworded", "answer": "r46: r46 \u2014 table row, file problem"}, {"n": 48, "text": "`model` shall read each bullet of `spec/index.md`'s `## Glossary` written `- **<term>**: <one-sentence definition>. Not: <word>, <word>.`, the `Not:` part optional, as a term of the bounded context with the id `term/<context path>/<term>`, the term lowercased with spaces as hyphens, and each word after `Not:` as a word the term avoids.", "prev": "[r48] A glossary entry is a bullet of `spec/index.md`'s `## Glossary` written `- **<term>**: <one-sentence definition>. Not: <word>, <word>.`, the `Not:` part optional, and `model` reads it as a term of the bounded context, with the id `term/<context path>/<term>`, the term lowercased with spaces as hyphens.\n[r50] **When** `model facts` is run, it prints for each glossary entry a `node` fact of kind `term`, a `term_of` fact naming the bounded context, and an `avoid` fact for each word after its `Not:`.", "kind": "reworded", "answer": "r48: r48 \u2014 takes r50's avoided words; the facts it prints moved to Implementation; r50: retired \u2192 r48"}, {"n": 49, "text": "Table row: file problem \u2014 a bullet in `spec/index.md`'s `## Glossary` is not of the form r48 gives", "prev": "[r49] **If** a bullet in `spec/index.md`'s `## Glossary` is not of that form, `model check` reports a file problem naming the file.", "kind": "reworded", "answer": "r49: r49 \u2014 table row, file problem"}, {"n": 51, "text": "`model` shall read a requirement or a scenario as mentioning a term or avoided word when it contains it as a whole word, whatever its case, with a plural \"s\" allowed, outside code spans, double-quoted strings and `@` tags, so that \"restore\" is no mention of \"store\" and a line naming the tag `@holding` is no mention of \"holding\".", "prev": "[r51] **When** `model facts` is run, it prints a `mentions` fact for each requirement and each scenario and each term or avoided word it contains, matching a whole word, whatever its case, with a plural \"s\" allowed, outside code spans, double-quoted strings and `@` tags, so that \"restore\" is no mention of \"store\" and a line naming the tag `@holding` is no mention of \"holding\".", "kind": "reworded", "answer": "r51: r51 \u2014 written as what `model` reads as a mention; the `mentions` fact moved to Implementation"}, {"n": 52, "text": "Table row: v_t1 \u2014 a requirement or a scenario mentions a word its context's glossary lists after `Not:`, named with the word and the term", "prev": "[r52] **If** a requirement or a scenario mentions a word that its context's glossary lists after `Not:`, `model check` reports it under v_t1, a word the glossary avoids, naming the requirement or scenario, the word and the term.", "kind": "reworded", "answer": "r52: r52 \u2014 table row, v_t1"}, {"n": 53, "text": "Table row: v_t2 \u2014 two glossary entries have one term", "prev": "[r53] **If** two glossary entries have one term, `model check` reports it under v_t2, a term has two entries.", "kind": "reworded", "answer": "r53: r53 \u2014 table row, v_t2"}, {"n": 54, "text": "Table row: v_t3 \u2014 a word one term lists after `Not:` is another term of the context, or the term itself", "prev": "[r54] **If** a word one term lists after `Not:` is another term of the context, or the term itself, `model check` reports it under v_t3, an avoided word is a term.", "kind": "reworded", "answer": "r54: r54 \u2014 table row, v_t3"}, {"n": 55, "text": "**If** `import clingo` fails, then `model check` shall run again, once, under the first interpreter that has clingo of `$SHOPSYSTEM_MODEL_PYTHON`, each `python3` on `PATH` outside the active virtualenv's `bin/`, `/usr/local/bin/python3` and `/usr/bin/python3`, in that order.", "prev": "[r55] **If** `import clingo` fails, `model check` looks for an interpreter that has clingo in this order: `$SHOPSYSTEM_MODEL_PYTHON`, each `python3` on `PATH` outside the active virtualenv's `bin/`, `/usr/local/bin/python3`, `/usr/bin/python3`, and runs again under the first that has it.\n[r56] **When** `model check` has run again under another interpreter, it does so once, and a second failure to import clingo does not run it again.", "kind": "reworded", "answer": "r55: r55 \u2014 takes r56 (\"once\"); r56: retired \u2192 r55"}, {"n": 59, "text": "Table row: v_d2 \u2014 an initiative is `abandoned` while a part of it, at any depth, is neither closed nor `withdrawn`", "prev": "[r59] **If** an initiative is `abandoned` while a part of it, at any depth, is neither closed nor `withdrawn`, `model check` reports the initiative under v_d2, an abandoned initiative has a part open.", "kind": "reworded", "answer": "r59: r59 \u2014 table row, v_d2"}, {"n": 61, "text": "Table row: file problem \u2014 the repository has `spec/decisions.md`, or a `decisions/`, `work/` or `records/` directory at its root, each named with `scripts/migrate`", "prev": "[r61] **If** the repository has `spec/decisions.md`, or a `decisions/`, `work/` or `records/` directory at its root, `model check` reports a file problem for each, naming the path and `scripts/migrate`.", "kind": "reworded", "answer": "r61: r61 \u2014 table row, file problem"}, {"n": 64, "text": "`model` shall read a decision's `source`, and not its `by`, as a list of ids, each resolved as r24 says for `source` and naming a node of any kind.", "prev": "[r64] `model` reads a decision's `source` as a list of ids, each resolved as r24 says for `source` and naming a node of any kind, and does not read its `by`.", "kind": "reworded", "answer": "r64: r64 \u2014 takes \"does not read its `by`\" into one line"}, {"n": 65, "text": "**When** `model rules` is run, `model rules` shall print each rule's code and plain label, one a line, the violations first and then the warnings, and exit 0.", "prev": "[r65] **When** `model rules` is run, it prints each rule's code and plain label, one a line, the violations first and then the warnings, and exits 0.", "kind": "reworded", "answer": "r65: r65 \u2014 unchanged meaning"}, {"n": 66, "text": "Table row: unresolved \u2014 a capability-proposal's `adds`, `changes` or `removes` names `term/<term>` the glossary does not have, except one a `merged` or `formulated` proposal removes", "prev": "[r66] **Where** a capability-proposal's `adds`, `changes` or `removes` names `term/<term>`, `model` reads it as that glossary term, and reports it as unresolved when the glossary has no such term, except a term that a `merged` or `formulated` proposal removes.", "kind": "reworded", "answer": "r66: r66 \u2014 table row, unresolved; reading `term/<term>` as the term is implied"}, {"n": 103, "text": "Table row: v_e1 \u2014 a Behaviour line is in none of EARS's patterns, combines their clauses in an order other than Where, While, then When or If, or has an If clause with no then", "prev": null, "kind": "add", "answer": "New line."}, {"n": 104, "text": "Table row: v_e2 \u2014 a Behaviour line has more than one \"shall\" or more than one sentence", "prev": null, "kind": "add", "answer": "New line."}, {"n": 105, "text": "**If** `model` cannot do what it was asked, then `model` shall exit non-zero, say why, and change nothing.", "prev": "[r39] **If** `model why` is given an argument that is not a requirement reference, it says why and exits 2.", "kind": "add", "answer": "r39: dropped: general line r105 \u2014 a minor refusal; exit 2 moved to Implementation"}]}, {"answer": "**45 lines \u2192 25.**\n**Open choices:**\n1. r7 is When, not If (a list that matches nothing is a result scripts read). Choice: kept as a line, not moved to\n   Implementation, since its exit 1 is what callers test.\n2. r15, r36 (move to a missing destination or to its own file) went to the general line: neither loses a\n   scenario. Choice: as written; say if either was a seen failure.", "key": "capability/feature-file-tools", "initiative": "ears", "release": "i13", "capability": "feature-file-tools", "file": "spec/capabilities/feature-file-tools.md", "status": "drafted", "lines": [{"n": 1, "text": "The `features` script shall read every `*.feature` under `--dir` (default `features`), recursively, never taking text inside a docstring as a scenario, keyword or tag.", "prev": "[r1] `features` reads every `*.feature` under `--dir` (default `features`), recursively, and text inside a docstring is never taken as a scenario, keyword or tag.", "kind": "reworded", "answer": "r1: r1 \u2014 unchanged meaning"}, {"n": 2, "text": "**If** a feature file contains a `Rule:` block outside a docstring, or an edit would leave one, then `features` shall refuse, naming the file, and leave every file as it was.", "prev": "[r2] **If** a feature file contains a `Rule:` block, `features` refuses, naming the file.\n[r3] **If** an edit would leave a file that `features` cannot read, `features` refuses the edit and leaves every file as it was. `features` reads a file as invalid when it contains a `Rule:` block outside a docstring, and checks nothing else of the result.", "kind": "reworded", "answer": "r2: r2 \u2014 takes r3 (an edit that would leave a `Rule:` block); the response is r3's, every file left as it was; r3: retired \u2192 r2 \u2014 \"checks nothing else of the result\" moved to Implementation"}, {"n": 4, "text": "**When** `features count --by-tag` is run, `features` shall print the number of scenarios with each tag and a total of every scenario, those with no tag included, counting a Scenario Outline once per Examples row and giving each scenario its feature's tags and its Examples table's tags.", "prev": "[r4] **When** `features count --by-tag` is run, `features` prints the number of scenarios with each tag and a total, counting a Scenario Outline once per Examples row and giving each scenario its feature's tags and its Examples table's tags. The total counts every scenario, those with no tag included.", "kind": "reworded", "answer": "r4: r4 \u2014 unchanged meaning, the two sentences in one"}, {"n": 5, "text": "**When** `features list --tag <tag>` or `--title <text>` is run, `features` shall print the file and title of each scenario whose tags, its feature's and its Examples' included, include that tag, or whose title contains the text.", "prev": "[r5] **When** `features list --tag <tag>` is run, `features` prints the file and title of each scenario whose tags, its feature's and its Examples' included, include that tag.\n[r6] **When** `features list --title <text>` is run, `features` prints the file and title of each scenario whose title contains the text.\n[r38] `features list --tag` finds the tag whether it is given with its leading `@` or without.", "kind": "reworded", "answer": "r5: r5 \u2014 takes r6 (`--title`); r38's leading `@` moved to Implementation; r6: retired \u2192 r5; r38: retired \u2192 r5"}, {"n": 7, "text": "**When** `features list` matches no scenario, `features` shall print nothing and exit 1.", "prev": "[r7] **If** `features list` matches no scenario, `features` prints nothing and exits 1.", "kind": "reworded", "answer": "r7: r7 \u2014 If \u2192 When: no match is a result, not a fault"}, {"n": 12, "text": "**When** `features move <title> --to <file>` is run, `features` shall move the scenario's block unchanged from its file to the end of the destination file.", "prev": "[r12] **When** `features move <title> --to <file>` is run, `features` removes the scenario's block from its file and appends it unchanged to the end of the destination file.", "kind": "reworded", "answer": "r12: r12 \u2014 unchanged meaning"}, {"n": 13, "text": "**Where** `--inline-background` is given, **when** `features move` is run, `features` shall put the source Background's steps before the moved scenario's first step.", "prev": "[r13] **Where** `--inline-background` is given, **when** `features move` is run, `features` puts the source Background's steps before the moved scenario's first step.", "kind": "reworded", "answer": "r13: r13 \u2014 unchanged meaning"}, {"n": 14, "text": "**Where** `--keep-feature-tags` is given, **when** `features move` is run, `features` shall put the source's feature tags that the destination's feature tags lack on a tag line of their own immediately above the moved scenario's `Scenario:` line, after any tag line the scenario already has, joined to none.", "prev": "[r14] **Where** `--keep-feature-tags` is given, **when** `features move` is run, `features` puts the source's feature tags that the destination's feature tags lack on a tag line of their own immediately above the moved scenario's `Scenario:` line, after any tag line the scenario already has, and joins them to none.", "kind": "reworded", "answer": "r14: r14 \u2014 unchanged meaning"}, {"n": 16, "text": "**When** `features verify-moved --from <dir>` finds every scenario in the two trees alike by title in its effective tags, description, and Background and own steps, `features` shall print how many scenarios match and exit 0.", "prev": "[r16] **When** `features verify-moved --from <dir>` finds every scenario in the two trees alike by title in its effective tags, description, and Background and own steps, `features` prints how many scenarios match and exits 0.", "kind": "reworded", "answer": "r16: r16 \u2014 unchanged meaning"}, {"n": 17, "text": "**If** `features verify-moved` finds a scenario whose effective tags, description or steps differ between the two trees, a title used by more than one scenario in either tree, or a title in one tree and not the other, then `features verify-moved` shall name each, as changed (with what changed), duplicate, missing or added, and exit 1.", "prev": "[r17] **If** a scenario's effective tags, description or steps differ between the two trees, `features verify-moved` names the scenario and which of them changed, and exits 1.\n[r18] **If** a title is used by more than one scenario in either tree, `features verify-moved` names the title as a duplicate and exits 1.\n[r37] **If** a title is in the `--from` tree and not the other, or in the other tree and not `--from`, `features verify-moved` names it as missing or as added, and exits 1.", "kind": "reworded", "answer": "r17: r17 \u2014 takes r18 (duplicate) and r37 (missing or added); r18: retired \u2192 r17; r37: retired \u2192 r17"}, {"n": 19, "text": "**When** `features deprecate <title>` is run with `--for <new title>` or `--for-removal`, `features` shall give the scenario the tag `@deprecated`, \" (deprecated)\" at the end of its title and a description line `Deprecated for: <new title>` or `Deprecated for: removal`, whether or not the replacement exists yet, and change nothing else in it.", "prev": "[r19] **When** `features deprecate <title> --for <new title>` or `--for-removal` is run, `features` gives the scenario the tag `@deprecated`, \" (deprecated)\" at the end of its title and a description line `Deprecated for: <new title>` or `Deprecated for: removal`, and changes nothing else in it, whether or not the replacement exists yet.\n[r39] **When** `features deprecate` has deprecated a scenario, `features` prints its file and its new title.", "kind": "reworded", "answer": "r19: r19 \u2014 unchanged meaning; r39: retired \u2192 r19 \u2014 the printed file and title moved to Implementation"}, {"n": 21, "text": "**When** `features deprecated` is run, `features` shall list each deprecated scenario with what it is deprecated for and, for a replacement, the file and `@r<n>` tag of the scenario with that title, saying on its line when it has no `Deprecated for:` line, no scenario has the replacement's title, or the replacement has no `@r<n>` tag.", "prev": "[r21] **When** `features deprecated` is run, `features` lists each deprecated scenario with what it is deprecated for and, for a replacement, the file and `@r<n>` tag of the scenario with that title, or says that no scenario has the replacement's title, or that the scenario is deprecated for removal.\n[r22] **When** `features deprecated` is run and no scenario is deprecated, `features` says none is deprecated.\n[r40] **When** `features deprecated` finds a deprecated scenario with no `Deprecated for:` line, or whose replacement has no `@r<n>` tag, `features` says so on that scenario's line.", "kind": "reworded", "answer": "r21: r21 \u2014 takes r40 (flagged on its line); r22's empty list wording in Implementation; r22: retired \u2192 r21; r40: retired \u2192 r21"}, {"n": 23, "text": "**When** `features retire <title>` is run on a scenario tagged `@deprecated`, `features` shall remove that scenario's block and leave the rest of the file as it was.", "prev": "[r23] **When** `features retire <title>` is run on a scenario tagged `@deprecated`, `features` removes that scenario's block and leaves the rest of the file as it was.", "kind": "reworded", "answer": "r23: r23 \u2014 unchanged meaning"}, {"n": 24, "text": "**If** `features retire` is given a scenario not tagged `@deprecated`, then `features` shall refuse because it is not deprecated, and leave the file as it was.", "prev": "[r24] **If** `features retire` is given a scenario not tagged `@deprecated`, `features` refuses because it is not deprecated, and leaves the file as it was.", "kind": "reworded", "answer": "r24: r24 \u2014 kept: `retire` removes a block"}, {"n": 25, "text": "**If** `features bindings` finds a `scenario(<feature>, \"<title>\")` call under `--tests` (default `tests`) whose title no feature file has, or not the feature it names, then `features` shall report the module, line, title and feature of each, and exit 1.", "prev": "[r25] **When** `features bindings` finds a `scenario(<feature>, \"<title>\")` call under `--tests` (default `tests`) whose title no feature file has, or not the feature it names, `features` reports the module, line, title and feature of each, and exits 1.", "kind": "reworded", "answer": "r25: r25 \u2014 unchanged meaning"}, {"n": 26, "text": "**When** `features bindings` finds every binding names a scenario, `features` shall say so and exit 0.", "prev": "[r26] **When** `features bindings` finds every binding names a scenario, `features` says so and exits 0.", "kind": "reworded", "answer": "r26: r26 \u2014 unchanged meaning"}, {"n": 28, "text": "**When** `features rebind <old> <new>` is run, `features` shall rewrite `<old>` to `<new>` in each binding call that names it and change nothing else in the module.", "prev": "[r28] **When** `features rebind <old> <new>` is run, `features` rewrites `<old>` to `<new>` in each binding call that names it, changes nothing else in the module, and prints how many bindings it rebound, zero included.", "kind": "reworded", "answer": "r28: r28 \u2014 the printed count moved to Implementation"}, {"n": 29, "text": "**If** the new title given to `features rebind` is no scenario's or several feature files', or a binding call names the old title in a string written over several lines, then `features` shall refuse and change no test module.", "prev": "[r29] **If** `features rebind` is given a new title that is no scenario in a feature file, `features` refuses and changes no test module.\n[r41] **If** `features rebind` is given a new title that several feature files have, `features` refuses and changes no test module.\n[r42] **If** a binding call names the old title of `features rebind` in a string written over several lines, `features` refuses, naming the module and line, and changes no test module.", "kind": "reworded", "answer": "r29: r29 \u2014 takes r41 (several feature files) and r42 (title over several lines); r41: retired \u2192 r29; r42: retired \u2192 r29 \u2014 naming the module and line moved to Implementation"}, {"n": 35, "text": "**If** the title given to `features tag`, `move`, `deprecate` or `retire` is in no file, is in several without `--file`, is not exactly once in the file `--file` names, or `--file` names a file outside `--dir`, then `features` shall refuse, naming each file that has the title, and change no file.", "prev": "[r10] **If** `features tag` is given a title no file has, or one several files have, `features` refuses, naming every file that has it, and changes no file.\n[r35] **If** `features move`, `features deprecate` or `features retire` is given a title no file has, or, without `--file`, one several files have, `features` refuses, naming every file that has it, and changes no file.\n[r53] **If** `--file` names a file that does not have the title, `features` refuses, naming the file, and changes no file.\n[r54] **If** `--file` names a file that has the title twice, `features` refuses, naming the file, and changes no file.\n[r55] **If** `--file` names a file outside `--dir`, `features` refuses and changes no file.", "kind": "reworded", "answer": "r10: retired \u2192 r35; r35: r35 \u2014 takes r10 (`tag`), r53, r54, r55 (`--file`); r53: retired \u2192 r35; r54: retired \u2192 r35; r55: retired \u2192 r35"}, {"n": 46, "text": "**If** `features` cannot do what it was asked, then `features` shall exit non-zero, say why on stderr, and change nothing.", "prev": "[r11] **If** `features tag` is given a tag not written `r<n>`, `features` exits 2 as bad usage and changes no file.\n[r15] **If** the destination of `features move` does not exist, `features` refuses and changes no file.\n[r20] **If** `features deprecate` is given a scenario already tagged `@deprecated`, `features` refuses it.\n[r27] **If** a test module under `--tests` does not parse, `features bindings` and `features rebind` refuse, naming the module.\n[r36] **If** the destination of `features move` is the scenario's own file, `features` refuses and changes no file.\n[r46] **If** `features` refuses a command or an edit, it says why on stderr and exits 1.", "kind": "reworded", "answer": "r11: dropped: general line r46 \u2014 exit 2 as bad usage in Implementation; r15: dropped: general line r46 \u2014 a minor refusal, listed in Implementation; r20: dropped: general line r46 \u2014 a minor refusal, listed in Implementation; r27: dropped: general line r46 \u2014 a minor refusal, listed in Implementation; r36: dropped: general line r46 \u2014 a minor refusal, listed in Implementation; r46: r46 \u2014 now the general line (\"exit non-zero, say why on stderr, change nothing\")"}, {"n": 51, "text": "**When** `features tag <title> r<n>` is run, `features` shall add `@r<n>` to the scenario's requirement tags and leave its other tags, its other `@r<m>` tags included, and every other line unchanged.", "prev": "[r51] **When** `features tag <title> r<n>` is run on a title exactly one file has, `features` makes `@r<n>` the scenario's one requirement tag, removing any other `@r<m>` tag it has, and leaves its other tags and every other line unchanged.", "kind": "reworded", "answer": "r51: r51 \u2014 0052's rule: adds `@r<n>`, keeps other `@r<m>` tags (as round 1)"}, {"n": 52, "text": "**Where** `--file <path>` is given, the `features` script shall look for the scenario's title in that file only, whatever the command.", "prev": "[r52] **Where** `--file <path>` is given, the `features` script looks for the scenario's title in that file only, whatever the command.", "kind": "reworded", "answer": "r52: r52 \u2014 unchanged meaning"}, {"n": 56, "text": "**Where** `--file <feature path>` is given, **when** `features rebind` is run, `features` shall rewrite only the bindings whose feature argument names that file, the feature argument resolved against `--dir`.", "prev": "[r56] **Where** `--file <feature path>` is given, **when** `features rebind` is run, `features` rewrites only the bindings whose feature argument names that file, the feature argument resolved against `--dir`; without `--file` it rewrites every binding of the old title.", "kind": "reworded", "answer": "r56: r56 \u2014 \"without `--file` every binding\" moved to Implementation (r28 says it)"}, {"n": 57, "text": "`features bindings` shall read a `scenarios(<path>, ...)` call under `--tests` as binding every scenario of each feature file it names, and of every feature file under a directory it names.", "prev": "[r57] `features bindings` reads a `scenarios(<path>, ...)` call under `--tests` as binding every scenario of each feature file it names, and of every feature file under a directory it names.", "kind": "reworded", "answer": "r57: r57 \u2014 unchanged meaning"}, {"n": 58, "text": "**Where** `--unbound` is given, **if** a scenario in the feature files named after `--unbound` (with none named, every feature file under `--dir`) is bound by no `scenario(...)` or `scenarios(...)` call, or by more than one, then `features bindings` shall report its file and title, with the module and line of each call, and exit 1.", "prev": "[r58] **Where** `--unbound` is given, **when** `features bindings` is run, it also reports the file and title of each scenario that no `scenario(...)` or `scenarios(...)` call binds, in the feature files named after `--unbound` or, with none named, every feature file under `--dir`, and exits 1 when there is one.\n[r59] **Where** `--unbound` is given, **if** a scenario is bound by more than one call, `features bindings` reports its file and title with the module and line of each call, and exits 1.", "kind": "reworded", "answer": "r58: r58 \u2014 takes r59 (bound more than once); r59: retired \u2192 r58"}]}, {"answer": "**14 lines \u2192 13.**\n**Open choices:**\n1. r3: \"formulating the rest of the capability\" is written as the manner of the one response. Choice: as written.", "key": "capability/formulation", "initiative": "ears", "release": "i13", "capability": "formulation", "file": "spec/capabilities/formulation.md", "status": "drafted", "lines": [{"n": 1, "text": "**When** lines are approved, `formulating-features` shall write the scenarios of each added or changed line that has one reading in its capability's feature file `features/<name>.feature`, one scenario or one outline for the line, or one scenario per reason for a line every call must keep (r9).", "prev": "[r1] **When** lines are approved, each added or changed line with one reading has its scenarios in its capability's feature file `features/<name>.feature`: one scenario or one outline, or one scenario per reason for a line every call must keep (r9); every scenario that is not deprecated formulates a line.", "kind": "reworded", "answer": "r1: r1 \u2014 \"every scenario that is not deprecated formulates a line\" left to r13, where `model check` shows it (r15 unused)"}, {"n": 2, "text": "`formulating-features` shall commit formulated scenarios without showing them to the person for approval.", "prev": "[r2] Formulated scenarios are committed without being shown to the person for approval.", "kind": "reworded", "answer": "r2: r2 \u2014 unchanged meaning"}, {"n": 3, "text": "**If** a line admits two readings, then `formulating-features` shall show the person the question with its two readings in place of that line's scenarios, formulating the rest of the capability.", "prev": "[r3] **If** a line admits two readings, it gets no scenario and the person is shown the question with its two readings; the rest of the capability is formulated.", "kind": "reworded", "answer": "r3: r3 \u2014 the question and the rest formulated in one response (r16 unused). Kept: the capability's purpose"}, {"n": 4, "text": "**When** a line whose old scenario passes today is changed or removed, `formulating-features` shall keep the old scenario in the suite, deprecated and with the `@r<n>` tags it had, until the work-item that turns its replacement green retires it.", "prev": "[r4] **When** a line is changed or removed and its old scenario passes today, the old scenario stays in the suite tagged `@deprecated`, with \" (deprecated)\" at the end of its title and a `Deprecated for:` line naming what replaces it, until the work-item that turns its replacement green retires it.\n[r12] A scenario tagged `@deprecated` keeps the `@r<n>` tag it had and formulates no line.", "kind": "reworded", "answer": "r4: r4 \u2014 joined with r12 (the deprecated scenario keeps its `@r<n>` tags); the deprecation's marks (tag, title suffix, `Deprecated for:`) moved to Implementation; r12: retired \u2192 r4 \u2014 \"formulates no line\" is `model check`'s reading of a deprecated scenario (r13, design-model-check), r18 unused"}, {"n": 5, "text": "**When** a line whose old scenario does not pass

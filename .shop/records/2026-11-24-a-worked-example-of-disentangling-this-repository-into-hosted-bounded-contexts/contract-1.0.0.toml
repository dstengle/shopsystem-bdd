  "upgrades#r16: While the release of this repository is after `0.25.0` and before `0.30.0`, when the person upgrades this repository, the upgrades service shall change every work-item file that mentions a requirement and change every feature that holds a scenario that has the `@deprecated` tag.",
  "upgrades#r20: While the release of this repository is after `0.29.0` and before `0.31.0`, when the person upgrades this repository, the upgrades service shall keep a frozen notice and change the decisions index of this repository.",
  "upgrades#r21: While the release of this repository is after `0.29.0` and before `0.31.0` and the asker of a frozen request is not `internal` and the frozen request is not `delivered`, `refused` or `withdrawn`, when the person upgrades this repository, the upgrades service shall change the frozen request.",
  "upgrades#r22: While the release of this repository is after `0.29.0` and before `0.31.0` and an initiative of this repository is not `done` or `abandoned`, when the person upgrades this repository, the upgrades service shall return every upgrade step whose release is `0.31.0` and the initiative.",
  "upgrades#r23: While the release of this repository is after `0.29.0` and before `0.31.0` and the asker of a frozen request is `internal` and the frozen request is not `delivered`, `refused` or `withdrawn`, when the person upgrades this repository, the upgrades service shall return the frozen request.",
  "upgrades#r24: While the release of this repository is after `0.30.0` and before `0.32.0`, when the person upgrades this repository, the upgrades service shall change the index file of this bounded context and return every upgrade step whose release is `0.32.0` and every term that violates `v_t11`.",
  "upgrades#r25: While the release of this repository is after `0.32.0` and before `0.33.0`, when the person upgrades this repository, the upgrades service shall change the index file of this bounded context and every capability and return every upgrade step whose release is `0.33.0`.",
  "upgrades#r26: While the release of this repository is `0.33.0`, when the person upgrades this repository, the upgrades service shall return every upgrade step whose release is `0.34.0` and every term that violates `w_value_kind`.",
  "upgrades#r27: While the release of this repository is the same as the release of the plugin and the release of this repository is after `0.34.0`, when the person upgrades this repository, the upgrades service shall return `no upgrade step is pending` and change no file.",
  "upgrades#r30: While the release of this repository is `0.34.0` and the release of the plugin is `0.34.1`, when the person upgrades this repository, the upgrades service shall return `no upgrade step is pending`, change the plugin version file of this repository and keep the plugin version file.",
  "upgrades#r36: While the release of this repository is before the release of the plugin and the scenario conftest of this repository conforms to the old scenario conftest form, when the person upgrades this repository, the upgrades service shall change the scenario conftest of this repository and keep the scenario conftest.",
  "upgrades#r37: While the release of this repository is before the release of the plugin and the scenario conftest of this repository does not conform to the old scenario conftest form and the scenario conftest of this repository does not conform to the scenario conftest form, when the person upgrades this repository, the upgrades service shall return the scenario conftest and not change the scenario conftest.",
]

[operations."upgrades.relocate"]

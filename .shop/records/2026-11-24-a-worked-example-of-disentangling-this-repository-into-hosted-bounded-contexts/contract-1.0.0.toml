  "bounded context (object: bounded context)",
]
outcomes = [
  "done",
  "refused",
]
reasons = [
  "uncommitted change",
  "tracked file of a ledger stem",
]
requirements = [
  "upgrades#r1: While this repository holds an old-layout directory, when the person relocates a bounded context, the upgrades service shall change every old-layout directory and every file that mentions an old-layout directory.",
  "upgrades#r2: While a decision ledger of this repository has a ledger entry, when the person relocates a bounded context, the upgrades service shall keep a design-decision of the ledger entry, keep no decision ledger, change the decisions index of this repository and complete the request.",
  "upgrades#r3: While a ledger entry supersedes another ledger entry, when the person relocates a bounded context, the upgrades service shall keep a design-decision of the ledger entry whose status is `superseded` and keep another design-decision that supersedes the design-decision.",
  "upgrades#r4: While a ledger entry that has a qualifier supersedes another ledger entry, when the person relocates a bounded context, the upgrades service shall keep a design-decision that holds the qualifier.",
  "upgrades#r5: While a ledger entry of a decision ledger has no ledger number, when the person relocates a bounded context, the upgrades service shall keep a ledger number of the ledger entry.",
  "upgrades#r6: While a Behaviour line of a capability has no line id, when the person relocates a bounded context, the upgrades service shall keep a line id of the Behaviour line.",
  "upgrades#r7: While a ledger entry has a stem and a tracked file in an old-layout directory has the same stem, if the person relocates a bounded context, then the upgrades service shall refuse the request and name the tracked file.",
  "upgrades#r8: While this repository holds an uncommitted change, if the person relocates a bounded context, then the upgrades service shall refuse the request and name the uncommitted change.",
]


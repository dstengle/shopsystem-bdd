[operations."language.parse"]
parameters = [
  "text (object: text)",
  "logical form (flag)",
]
outcomes = [
  "returned → the reading",
  "refused",
]
reasons = [
  "requirement not in the language",
  "requirement of more than one logical form",
  "reading rule broken",
  "construct with no catalogue entry",
  "fragment",
]
requirements = [
  "parsing#r1: When the person parses a requirement that conforms to the language reference, the language service shall complete the request.",
  "parsing#r2: When the person parses a requirement that conforms to the language reference with the logical form, the language service shall return one logical form of the requirement and complete the request.",
  "parsing#r3: If the person parses a requirement that does not conform to the language reference, then the language service shall refuse the request and name the requirement.",
  "parsing#r5: If the person parses a requirement that violates a reading rule, then the language service shall refuse the request and name the reading rule.",
  "parsing#r6: If the person parses a requirement that uses a construct that has no catalogue entry, then the language service shall refuse the request and name the construct.",
  "parsing#r7: If the person parses a fragment, then the language service shall refuse the request, name the fragment and return a term.",
  "parsing#r8: While the corpus holds a logical form of a requirement, when the person parses the requirement with the logical form, the language service shall return the logical form.",
  "parsing#r9: While a parse cache holds the parse of a requirement, when the person parses the requirement, the language service shall return the parse of the requirement, keep no compiled grammar and complete the request.",
  "parsing#r10: While a requirement has a parse that no parse cache holds, when the person parses the requirement, the language service shall keep a parse cache and complete the request.",
  "parsing#r11: While a requirement has a parse that no parse cache holds and the compiled grammar of the requirement exists, when the person parses the requirement, the language service shall keep no compiled grammar and complete the request.",
  "parsing#r12: When the person parses a requirement that uses `order-by` with the logical form, the language service shall return a logical form that uses an order of a member of a collection.",
  "parsing#r13: While a verb has two frames, when the person parses a requirement that uses a frame of the verb, the language service shall return one logical form of the requirement and complete the request.",
  "parsing#r14: If the person parses a requirement that has a plural object, then the language service shall refuse the request and name the requirement.",
  "parsing#r15: If the person parses a requirement that has more than one logical form, then the language service shall refuse the request and name the requirement and the ambiguous text of the requirement.",
  "parsing#r16: If the person parses a requirement whose ambiguous text uses two frames of a verb, then the language service shall refuse the request and name every frame that the ambiguous text uses.",
  "parsing#r17: When the person parses a requirement that uses `param-of`, the language service shall complete the request.",

# The person chose one batch of all seven ready items (2026-11-19).
batch_size = 7

# This repository is the plugin itself: a batch's review checks run the batch tree's own
# scripts (paths relative to the tree each check runs in), not the main checkout's (b173).
[review]
checks = [
  "python3 scripts/tools size --limit 300",
  "python3 scripts/tools check --base {forked_from}",
  "python3 scripts/features generate --check",
  "python3 scripts/features bindings --unbound",
  "python3 scripts/spec decisions --check",
]

[batch]
rules = ["Never chain cp and rm in one shell command, and keep shell variables few.", "Worktrees of older work (.shop/worktrees/* of other or earlier batches, .claude/worktrees/) are never reference material: the reference is the base branch and its own worktree.", "The driver dispatches its task, fix and review subagents in the foreground (all of one step in one message, run_in_background false), so their results come back to it; it never ends its turn while one of its subagents is still running."]
